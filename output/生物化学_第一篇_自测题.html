<script>
var Q = [{"type": "short_answer", "points": 5, "question": "【名词解释】什么是生物化学？", "answer": "生物化学是研究生物体内化学分子与化学反应的科学，在分子水平上阐明生命现象的本质。其核心任务包括：阐明生物大分子的结构与功能关系、生物体内的物质与能量代谢过程、遗传信息的传递与表达调控机制。", "explanation": "定义包含三个要素：研究对象（生物体分子/反应）、研究层面（分子水平）、核心目标（阐明生命本质）。备考时注意三任务缺一不可。", "pitfall": "错误：'生物化学是研究化学的'——正确：研究生物体内的化学，对象是生命体而非一般化学反应。"}, {"type": "short_answer", "points": 5, "question": "【名词解释】弱相互作用（非共价力）", "answer": "弱相互作用是分子间或分子内非共价键形式的相互作用，主要包括氢键、疏水相互作用、范德华力和离子键（盐桥）。虽然单个弱相互作用能量远小于共价键，但大量弱相互作用的协同效应在维持蛋白质等生物大分子构象中起决定性作用。", "explanation": "核心关键词：非共价键、四种类型、协同效应（不是简单相加）。单独一种弱、加起来强——这正是生物体系中可逆调控的基础。", "pitfall": "错误：'弱相互作用就是弱的化学键'——正确：它不是化学键（共价键），而是分子间的非共价力。"}, {"type": "short_answer", "points": 5, "question": "【名词解释】疏水相互作用", "answer": "疏水相互作用是指非极性分子或基团在水溶液中倾向于聚集在一起以尽量减少与水接触的现象。它是熵驱动的自发过程——非极性分子周围的水分子原本形成有序笼状结构（低熵），非极性分子聚集后释放这些水分子（熵增），从而使系统总自由能降低。", "explanation": "三个关键词：非极性分子聚集、熵驱动、水分子有序结构的释放。这个机理是蛋白质折叠和生物膜形成的核心驱动力。", "pitfall": "错误：'疏水相互作用是疏水分子之间的吸引力'——正确：它本质是水分子熵增驱动的热力学效应，而非疏水分子间有直接的吸引力。"}, {"type": "short_answer", "points": 5, "question": "【名词解释】氢键", "answer": "氢键是氢原子与一个电负性较强的原子（如O或N）共价结合后，又与另一个电负性原子之间形成的非共价相互作用。氢键能量约12-30 kJ/mol，在维持蛋白质α-螺旋和β-折叠、DNA双螺旋碱基配对中起关键作用。", "explanation": "氢键的三个参与方：供体(D-H)、H、受体(A)。结构通式：D-H···A。注意区分供体和受体。", "pitfall": "错误：'氢键就是水中O和H之间的连接'——正确：水分子内O-H是共价键，水分子间的O-H···O才是氢键。"}, {"type": "short_answer", "points": 5, "question": "【名词解释】偶联反应", "answer": "偶联反应是指将一个热力学不利反应（ΔG＞0）与一个热力学有利反应（如ATP水解，ΔG≪0）通过共同中间物连接起来，使总反应的ΔG＜0从而自发进行的策略。偶联反应是生物体内能量转移的基本方式。", "explanation": "偶联不是简单的「同时发生」，而是通过共同中间物实现化学连接。ATP的磷酸基团转移是典型的偶联方式。", "pitfall": "错误：'偶联就是把两个反应放一起'——正确：必须通过共同中间物实现化学连接，总ΔG=ΔG₁+ΔG₂。"}, {"type": "single_choice", "points": 2, "question": "生物体干重中含量最多的元素是？", "options": ["A. 氧(O)", "B. 碳(C)", "C. 氢(H)", "D. 氮(N)"], "answer": "B", "explanation": "干重（去除水分后）中C含量最高，约占50%以上。若按鲜重（含水）计，则H原子数最多（水分子含2个H原子）。这是经典易混淆考点，注意区分'干重'和'鲜重'以及'质量'和'原子数'。", "pitfall": "错误选A（氧）：鲜重中O含量最高（水占70%）。错误选C（氢）：原子数最多，但质量占比不高。"}, {"type": "single_choice", "points": 2, "question": "以下哪一项不是水的生物学功能？", "options": ["A. 优良溶剂，溶解和运输各种分子", "B. 作为弱相互作用的介质", "C. 储存和传递遗传信息", "D. 参与水解反应"], "answer": "C", "explanation": "储存和传递遗传信息是核酸(DNA/RNA)的功能。水的生物学功能包括溶剂作用、介质作用（氢键/疏水作用）、热缓冲、参与化学反应（水解、光合作用）等。", "pitfall": "无。选项C明显与水的化学性质无关，核酸才是遗传信息的载体。"}, {"type": "single_choice", "points": 2, "question": "蛋白质分子中连接氨基酸单体的化学键是？", "options": ["A. 氢键", "B. 肽键", "C. 糖苷键", "D. 3',5'-磷酸二酯键"], "answer": "B", "explanation": "四大类生物大分子的连接键：蛋白质→肽键（氨基酸之间）；核酸→3',5'-磷酸二酯键（核苷酸之间）；多糖→糖苷键（单糖之间）。这是基本知识，必须分清楚。", "pitfall": "错误选D（3',5'-磷酸二酯键）：这是核酸(DNA/RNA)中核苷酸间的连接键，不是蛋白质。"}, {"type": "single_choice", "points": 2, "question": "关于疏水相互作用，以下说法正确的是？", "options": ["A. 它是疏水分子间的化学键", "B. 它主要由焓驱动", "C. 它是熵驱动的自发过程", "D. 它在所有溶剂中都存在"], "answer": "C", "explanation": "疏水相互作用的本质是熵驱动——非极性分子周围的笼状水结构被释放导致熵增。A错误（不是化学键）；B错误（主要熵驱动而非焓驱动）；D错误（依赖于水的特殊氢键网络结构）。", "pitfall": "错误选B（焓驱动）：这是最常见的误解。疏水相互作用主要是熵效应，水的氢键网络结构导致非极性溶剂周围水分子有序化（低熵），聚集释放后熵增。"}, {"type": "single_choice", "points": 2, "question": "以下哪位科学家因首次人工合成尿素而打破了'生命力'学说？", "options": ["A. Fischer", "B. Krebs", "C. Wöhler", "D. Watson"], "answer": "C", "explanation": "德国化学家Wöhler于1828年用无机物氰酸铵加热合成了有机物尿素（原本认为只有生物体才能合成有机物），彻底动摇了'生命力'学说。Fischer→锁钥模型；Krebs→TCA循环；Watson→DNA双螺旋。", "pitfall": "错误选B（Krebs）：Krebs发现TCA循环（1937年），年代比Wöhler晚约100年。人物-贡献的对应关系是考研填空题、选择题的高频考点。"}, {"type": "true_false", "points": 2, "question": "脂类属于生物大分子，是由单体聚合而成的聚合物。", "answer": "错误", "explanation": "脂类虽然不是由单体线性聚合而成的经典聚合物，但它们通过自组装形成膜等超分子结构，是生物体内第四大类重要分子。严格来说脂类不符合'大分子=单体聚合'的定义。", "pitfall": "陷阱在于'生物大分子'的严格定义。蛋白质、核酸、多糖是线性聚合物；脂类不是——但考试中常并列讨论四大类生物分子，要注意区分。"}, {"type": "true_false", "points": 2, "question": "一个热力学自发反应（ΔG＜0）意味着该反应一定进行得很快。", "answer": "错误", "explanation": "ΔG只反映热力学自发性（能不能发生），不反映动力学速率（发生得有多快）。葡萄糖氧化ΔG极负，但常温下自发进行极慢，需要酶催化加速。热力学和动力学是独立的概念。", "pitfall": "这是经典易混淆点。记住口诀：'热力学管方向，动力学管速度'。"}, {"type": "true_false", "points": 2, "question": "氢键能量虽小（12-30 kJ/mol），但大量氢键的协同作用可以稳定蛋白质等生物大分子的高级结构。", "answer": "正确", "explanation": "单个氢键确实弱（共价键约300-400 kJ/mol），但在蛋白质中可能有数百个氢键协同作用，总效果显著。这种'个个弱、加起来强'的特征使生物大分子结构既有稳定性，又可在生理条件下被调节。", "pitfall": "无。这是正确表述。弱相互作用的可逆性和协同效应是生命调控的化学基础。"}, {"type": "short_answer", "points": 10, "question": "试述生物体内四种主要弱相互作用（非共价力）的名称、本质及其生物学意义。", "answer": "四种弱相互作用：(1)氢键：电负性原子间的氢共享，能量12-30 kJ/mol，维持蛋白质α-螺旋/β-折叠和DNA碱基配对；(2)疏水相互作用：非极性分子在水中的聚集倾向，熵驱动，是蛋白质折叠和生物膜形成的主驱动力；(3)范德华力：瞬时偶极间吸引力，能量0.4-4 kJ/mol，体现于分子紧密接触时的形状互补性；(4)离子键（盐桥）：正负电荷基团间的静电引力，能量20-40 kJ/mol（水中减弱），稳定蛋白质三维构象。它们的共同特征：单个弱但有协同放大效应，生理条件下可逆，共同维持生物大分子的高级结构。", "explanation": "满分要点：四种力的名称、本质（物理来源）、能量范围、各举1-2个生物学实例、总结共同特征。缺任何一项扣2-3分。", "pitfall": "常见失分点：(1)漏写能量范围；(2)四种力只写了三种；(3)混淆疏水相互作用的驱动力（答成焓驱动或'非极性分子间的吸引力'都不得分）。"}, {"type": "short_answer", "points": 10, "question": "为什么说水是生命不可缺少的物质？请从多个角度论述水的生物学重要性。", "answer": "水对生命的重要性体现在以下方面：(1)优良溶剂：水的高介电常数使其能有效屏蔽离子间引力，溶解多种无机离子和极性有机分子，实现物质运输；(2)弱相互作用介质：水的氢键网络创造了疏水效应，是蛋白质折叠和膜形成的驱动力；(3)热缓冲能力：水的比热容大（4.18 J/g·℃），帮助生命体维持恒温，保护细胞免受温度剧烈波动的伤害；(4)化学反应参与者：水是水解反应的反应物，也是光合作用中光反应的电子供体；(5)结构功能：水分子与生物大分子的氢键有助于维持其功能构象。", "explanation": "至少应从溶剂作用、弱相互作用介质、热缓冲、反应参与四个方面展开。每个方面1-2句说明即可拿满分。", "pitfall": "常见失分点：(1)只写了'溶剂'一个角度；(2)忽略了疏水相互作用与水的因果关系；(3)没有提到水的热缓冲功能。"}, {"type": "short_answer", "points": 10, "question": "论碳元素在生命化学中的核心地位。为什么生命选择了碳而不是硅？", "answer": "碳元素的核心地位：(1)四价键合能力：碳可以形成四个共价单键，或双键、三键，产生极大的结构多样性；(2)键能适中：C-C键能约348 kJ/mol，既稳定（常温保持结构）又可在酶催化下断裂，是代谢可行性的化学基础；(3)四面体构型：sp³杂化形成手性中心，是分子识别和酶特异性的结构基础；(4)链状和环状结构：碳可以形成长链、支链和环状分子骨架。\n碳vs硅的对比：(1)Si-Si键能(约226 kJ/mol)明显低于C-C，形成的长链不稳定；(2)SiO₂是固体，而CO₂是气体，含碳化合物更适合在生物体系中运输；(3)碳的成键多样性（单、双、三键）远超硅。碳之所以被生命选中，不是因为它'特殊'，而是因为它的化学性质恰好满足了生命的需要。", "explanation": "这道题常出在论述题中。得分点：碳的四价性、键能适中、四面体构型、与硅的对比。不写'与硅对比'通常扣3-5分。", "pitfall": "常见失分点：(1)只说'碳的四价性'过于简单；(2)不提及与硅的对比论证（这是本题的核心深度分）；(3)没有从'键能适中'角度论述代谢可行性。"}, {"type": "fill_blank", "points": 2, "question": "生物化学研究的三个核心任务是：阐明生物大分子的____与____关系，阐明生物体内的____代谢与____代谢，阐明____信息的传递与表达调控机制。", "answer": "结构，功能，物质，能量，遗传", "explanation": "三任务必须完整记忆：结构-功能关系、物质-能量代谢、遗传信息传递表达。考研填空题经常直接挖空这三点。", "pitfall": "常见错误：第二任务漏写'能量'，只写'物质代谢'。"}, {"type": "fill_blank", "points": 2, "question": "组成生命体的六种主要元素是____、____、____、____、____、____。", "answer": "C，H，O，N，S，P", "explanation": "六种主量元素C、H、O、N、S、P按化学符号顺序记忆更安全。注意：Na、K、Ca等虽也重要，但考题问'主要元素'时指C、H、O、N、S、P六种。", "pitfall": "常见错误：把S或P漏掉，或误加Cl/Na等。六种主量元素是C、H、O、N、S、P。"}, {"type": "fill_blank", "points": 2, "question": "核酸中连接核苷酸单体的化学键是____键，多糖中连接单糖的是____键，蛋白质中连接氨基酸的是____键。", "answer": "3',5'-磷酸二酯，糖苷，肽", "explanation": "三种键名的精确记忆：核酸→3',5'-磷酸二酯键（注意3'和5'的位置和撇号）；多糖→糖苷键（不是'葡萄糖键'）；蛋白质→肽键。", "pitfall": "常见错误：把核酸键写成'磷酸二酯键'漏了3',5'-；把多糖键写成'葡萄糖苷键'（β-1,4-糖苷键是纤维素中的具体类型，不是通用名称）。"}, {"type": "fill_blank", "points": 2, "question": "细胞的'能量货币'是____，其水解的ΔG°'约为____kJ/mol。", "answer": "ATP（三磷酸腺苷），-30.5", "explanation": "ATP是标准答案。数值-30.5 kJ/mol是标准状态下的自由能变化，实际细胞中因ATP/ADP比例和Mg²⁺浓度，ΔG约为-50 kJ/mol左右。", "pitfall": "常见错误：只写-30.5而忘写负号，或写成ADP。"}, {"type": "fill_blank", "points": 2, "question": "Watson和Crick于____年提出了DNA____结构模型，这一发现标志着____生物学时代的开端。", "answer": "1953，双螺旋，分子", "explanation": "1953年是生物化学史上最重要的年份之一。DNA双螺旋→分子生物学诞生。Watson、Crick和Wilkins因此获1962年诺贝尔奖（Franklin因早逝未获奖）。", "pitfall": "常见错误：年份写成1952或1954；第三空写'结构生物学'而非'分子生物学'。"}, {"type": "single_choice", "points": 3, "question": "下列氨基酸中，哪个属于碱性氨基酸？", "options": ["A. 天冬氨酸 (Asp/D)", "B. 谷氨酸 (Glu/E)", "C. 精氨酸 (Arg/R)", "D. 酪氨酸 (Tyr/Y)"], "answer": "C", "explanation": "碱性氨基酸包括赖氨酸(Lys/K)、精氨酸(Arg/R)和组氨酸(His/H)。天冬氨酸和谷氨酸是酸性氨基酸，酪氨酸是极性不带电氨基酸。", "pitfall": "His虽为碱性氨基酸，但其pK_R≈6.0，在生理pH(7.4)下仅部分质子化，容易被误判为中性。"}, {"type": "single_choice", "points": 3, "question": "α-螺旋每圈含多少个氨基酸残基？", "options": ["A. 3.0", "B. 3.6", "C. 4.0", "D. 5.4"], "answer": "B", "explanation": "经典右手α-螺旋每圈含3.6个氨基酸残基，螺距0.54 nm，每个残基升高0.15 nm。这是Pauling和Corey提出α-螺旋模型的核心参数之一。", "pitfall": "胶原蛋白的三股螺旋每圈3个残基（非α-螺旋），考试中容易把两种螺旋参数混淆。务必区分：α-螺旋=3.6残基/圈，胶原螺旋=3残基/圈。"}, {"type": "single_choice", "points": 3, "question": "α-螺旋中氢键的形成模式是：", "options": ["A. 第i个残基的C=O与第i+3个残基的NH", "B. 第i个残基的C=O与第i+4个残基的NH", "C. 第i个残基的NH与第i+3个残基的C=O", "D. 第i个残基的NH与第i+5个残基的C=O"], "answer": "B", "explanation": "α-螺旋中每个肽键的C=O与沿螺旋方向第4个残基（i+4）的NH形成氢键，这是α-螺旋最特征性的结构参数。3₁₀螺旋为i→i+3，π螺旋为i→i+5。", "pitfall": "注意氢键方向：C=O → H-N，而非N-H → O=C。是i的C=O指向i+4的NH，方向由N端向C端。"}, {"type": "single_choice", "points": 4, "question": "镰刀形细胞贫血的分子基础是血红蛋白β链上哪个氨基酸突变？", "options": ["A. 第6位Glu→Lys", "B. 第6位Glu→Val", "C. 第6位Val→Glu", "D. 第8位Glu→Val"], "answer": "B", "explanation": "HbS是β链第6位谷氨酸(Glu)突变为缬氨酸(Val)，即Glu6→Val。单个亲水/带电残基被疏水残基替换→脱氧HbS表面产生疏水补丁→聚合→镰刀形细胞。", "pitfall": "注意方向：是Glu→Val不是Val→Glu；位置是β链第6位不是第8位。这一突变也是第一种在分子水平被阐明的遗传病。"}, {"type": "single_choice", "points": 4, "question": "维持蛋白质三级结构的主要驱动力是：", "options": ["A. 氢键", "B. 离子键（盐桥）", "C. 疏水作用", "D. 二硫键"], "answer": "C", "explanation": "疏水作用（非极性侧链从水中聚集到蛋白质内部）是蛋白质折叠的主要热力学驱动力。虽然氢键、离子键和范德华力也贡献于结构稳定性，但疏水作用贡献了主要的折叠自由能。", "pitfall": "二硫键是共价键，强度最大，但它锁定的是已经折叠好的构象，不是折叠过程的驱动力。细胞质蛋白通常不含二硫键，说明折叠不依赖二硫键。"}, {"type": "single_choice", "points": 4, "question": "关于肽键的化学本质，下列叙述错误的是：", "options": ["A. 肽键具有部分双键性质，不能自由旋转", "B. 天然蛋白质中绝大多数肽键为反式构型", "C. 肽键的C—N键长介于典型的单键和双键之间", "D. X-Pro肽键在任何情况下都是反式构型"], "answer": "D", "explanation": "前三项均正确。D错误：X-Pro肽键约6%为顺式构型，因为脯氨酸的环状结构降低了顺反两种构型的能量差异。反式构型在X-Pro中仍占优势（约94%），但顺式比例明显高于其他肽键。", "pitfall": "脯氨酸的特殊性不仅体现在破坏α-螺旋，还体现在其前一个肽键(X-Pro)有较高的顺式构型比例。这是脯氨酸作为'结构捣乱者'的另一面。"}, {"type": "single_choice", "points": 4, "question": "胶原蛋白的氨基酸序列特征性重复模体是：", "options": ["A. (Gly-Pro-Pro)ₙ", "B. (Gly-X-Y)ₙ", "C. (Ala-Gly-Ser)ₙ", "D. (Pro-Hyp-Gly)ₙ"], "answer": "B", "explanation": "胶原蛋白的序列特征为(Gly-X-Y)ₙ重复，其中X常为脯氨酸(Pro)，Y常为羟脯氨酸(Hyp)。每第三个位置必须是Gly，因为三股螺旋内部空间极其狭窄，只有H原子（Gly的侧链）能够被容纳。", "pitfall": "A虽也是常见序列（特别是胶原蛋白的模型肽），但(B)是更一般的形式。考题通常考察(Gly-X-Y)ₙ这一概括性表达，以及Gly为何必不可少。"}, {"type": "single_choice", "points": 4, "question": "关于血红蛋白(Hb)和肌红蛋白(Mb)，下列描述正确的是：", "options": ["A. Hb的氧合曲线为双曲线", "B. Mb的氧合曲线为S形曲线", "C. Hb具有正协同效应，Mb不具有协同效应", "D. Mb的P₅₀大于Hb的P₅₀"], "answer": "C", "explanation": "Hb四聚体具有正协同效应（S形氧合曲线），Mb单体无协同效应（双曲线）。Hb的P₅₀≈26 torr，Mb的P₅₀≈2.8 torr，因此Mb对O₂亲和力远高于Hb。", "pitfall": "P₅₀越小表示亲和力越高，不是越大越高。容易混淆：Mb P₅₀小(2.8)→高亲和力→适合储氧；Hb P₅₀大(26)→低亲和力→适合在组织释放O₂。"}, {"type": "single_choice", "points": 4, "question": "2,3-BPG对血红蛋白的调节机制是：", "options": ["A. 与R态Hb结合，提高O₂亲和力", "B. 与T态Hb结合，降低O₂亲和力", "C. 与血红素Fe²⁺竞争O₂结合位点", "D. 与O₂协同结合，促进O₂在肺部结合"], "answer": "B", "explanation": "2,3-BPG结合于Hb四聚体中央空穴（β链之间），选择性地稳定T态（脱氧Hb），使氧合曲线右移，降低O₂亲和力，促进O₂在组织中释放。胎儿HbF因γ链143位Ser而非His，与BPG结合减弱，O₂亲和力更高。", "pitfall": "BPG与Hb的结合位点在亚基间中央空穴（正电荷残基），而非血红素铁。它不直接占据O₂结合位点，而是通过稳定T态间接降低O₂亲和力。"}, {"type": "single_choice", "points": 4, "question": "下列关于凝胶过滤层析的叙述，正确的是：", "options": ["A. 大分子蛋白质先被洗脱", "B. 小分子蛋白质先被洗脱", "C. 洗脱顺序与分子电荷相关", "D. 洗脱顺序与等电点相关"], "answer": "A", "explanation": "凝胶过滤（分子筛层析）按分子大小分离：大蛋白质无法进入凝胶珠内部孔道，直接流过柱床间隙→先洗脱；小蛋白质能进入孔内→路径更长→后洗脱。分离依据是流体力学半径而非电荷或pI。", "pitfall": "注意与SDS-PAGE区别：SDS-PAGE中大分子迁移慢（在凝胶基质中受阻更大），凝胶过滤中大分子先出（不进孔）。两者原理不同——凝胶过滤是'筛分'，SDS-PAGE是'电泳迁移+筛分'。"}, {"type": "true_false", "points": 2, "question": "所有的20种标准氨基酸都具有手性中心（α-碳为手性碳）。", "answer": "错误", "explanation": "甘氨酸(Gly/G)的侧链为H原子，α-碳上连接两个相同的H原子，不具有手性中心。其余19种氨基酸的α-碳均为手性碳，天然蛋白质中均为L-构型。", "pitfall": "甘氨酸是最简单的氨基酸，也是唯一没有手性的标准氨基酸。正因为没有手性，它在Ramachandran图中允许的区域远大于其他氨基酸。"}, {"type": "true_false", "points": 2, "question": "脯氨酸(Pro/P)是α-螺旋的强破坏者，因为它无法形成链内氢键且其环状结构引入'扭结'。", "answer": "正确", "explanation": "脯氨酸的α-N原子参与吡咯环形成，缺少形成氢键所需的N-H基团（它是亚氨基酸），无法参与α-螺旋的i→i+4氢键。同时环状结构固定φ角，在α-螺旋中引入弯曲，破坏螺旋的规整性。", "pitfall": "脯氨酸常位于α-螺旋的N端（前3个残基内）或转角区域。它不是完全不出现于螺旋中——但出现在螺旋内部会中断螺旋。"}, {"type": "true_false", "points": 3, "question": "Bohr效应指的是H⁺和CO₂促进血红蛋白释放O₂，是代谢旺盛组织获取更多O₂的生理调节机制。", "answer": "正确", "explanation": "Bohr效应由Christian Bohr于1904年发现：pH降低(H⁺↑)和CO₂↑使Hb对O₂亲和力下降→氧合曲线右移→P₅₀增大→在组织中释放更多O₂。分子机制：H⁺与β链His146结合，CO₂与N端形成氨基甲酸，均稳定T态。", "pitfall": "注意Bohr效应和Haldane效应的区别：Bohr效应=H⁺/CO₂影响O₂亲和力；Haldane效应=O₂结合影响CO₂/H⁺的运输。两者互为热力学偶联的不同方面。"}, {"type": "true_false", "points": 3, "question": "Anfinsen的核糖核酸酶变性-复性实验证明了蛋白质的一级结构决定其三维结构。", "answer": "正确", "explanation": "Anfinsen实验(1957年)：用尿素（破坏氢键/疏水作用）和β-巯基乙醇（还原二硫键）使核糖核酸酶完全变性失活→透析去除变性剂和还原剂→酶活性自发恢复。证明氨基酸序列包含了蛋白质折叠的全部信息。1972年获诺贝尔化学奖。", "pitfall": "Anfinsen实验的正确性是有条件的：①体外简单体系；②小蛋白（124残基）；③不需要分子伴侣。在大而复杂的蛋白质中，体内折叠通常需要分子伴侣辅助。"}, {"type": "true_false", "points": 3, "question": "在SDS-PAGE电泳中，蛋白质的迁移速率与其等电点成正比。", "answer": "错误", "explanation": "SDS-PAGE中蛋白质迁移速率主要取决于分子量（小蛋白迁移快）。SDS以约1.4 g/g蛋白质的比例结合，使所有蛋白质带上大量负电荷（掩盖原有电荷差异），且SDS-蛋白质复合物呈棒状，因此迁移率仅与分子量的对数呈线性关系。", "pitfall": "SDS-PAGE分离依据是分子量而非等电点或原有电荷。等电聚焦(IEF)才是按pI分离的方法。2D电泳=第一维IEF(pI)+第二维SDS-PAGE(分子量)。"}, {"type": "fill_blank", "points": 2, "question": "酸性氨基酸包括______和______（写中文全称或三字母缩写）。", "answer": "天冬氨酸(Asp)和谷氨酸(Glu)", "explanation": "20种标准氨基酸中含两个羧基的酸性氨基酸只有两种：天冬氨酸(Asp/D)和谷氨酸(Glu/E)。在生理pH(~7.4)下，其侧链羧基去质子化(-COO⁻)，带负电荷。", "pitfall": "天冬酰胺(Asn)和谷氨酰胺(Gln)侧链为酰胺而非羧基，属于极性不带电氨基酸，不属于酸性氨基酸。二者的名称相似容易混淆。"}, {"type": "fill_blank", "points": 2, "question": "组成蛋白质的20种标准氨基酸中，唯一在生理pH范围内具有缓冲能力的氨基酸是______（写三字母缩写），其侧链pK_R约为______。", "answer": "His；6.0", "explanation": "组氨酸(His/H)侧链咪唑基的pK_R ≈ 6.0，在生理pH(7.4)附近可发生质子化/去质子化可逆转变，赋予蛋白质缓冲能力，并使其成为许多酶的催化关键残基（如丝氨酸蛋白酶催化三联体）。", "pitfall": "虽然Cys的pK_R≈8.3也在生理pH附近，但Cys在蛋白质内部多以二硫键形式存在，游离—SH通常不参与酸碱缓冲。His是教科书标准的'缓冲氨基酸'。"}, {"type": "fill_blank", "points": 3, "question": "血红蛋白的别构效应模型中，MWC模型假设所有亚基同步在______态和______态之间转换，配体选择性结合______态。（填T或R）", "answer": "T；R；R", "explanation": "MWC（齐变/协同）模型假设：①别构蛋白存在T态（紧张态，低亲和力）和R态（松弛态，高亲和力）的构象平衡；②所有亚基同步转换（全T或全R），始终保持分子对称性；③配体(O₂)选择性结合R态→拉动平衡向R态移动→正协同效应。", "pitfall": "MWC不假设配体'诱导'构象变化，而是认为两种构象预先存在（构象选择/population shift）。这是MWC与KNF模型的根本哲学差异。"}, {"type": "fill_blank", "points": 3, "question": "免疫球蛋白IgG由______条重链和______条轻链组成，抗原结合位点位于______区和______区共同构成的Fab片段顶端。", "answer": "2；2；V_H；V_L", "explanation": "IgG是Y形分子：2条重链(H，~50 kDa) + 2条轻链(L，~25 kDa)。每对H-L链分为Fab（抗原结合片段，含V_H和V_L）和Fc（可结晶片段）。V_H和V_L中各有3个互补决定区(CDR)直接与抗原表位接触。", "pitfall": "每条链都有V区和C区。抗原结合位点由V_H + V_L共同构成（非单独的重链或轻链可变区）。"}, {"type": "short_answer", "points": 10, "question": "简述α-螺旋的结构特征（包括每圈残基数、氢键模式、螺距、φ和ψ角），并说明为什么脯氨酸和甘氨酸不利于α-螺旋的形成。", "answer": "【α-螺旋结构特征】\n① 右手螺旋，每圈3.6个氨基酸残基，螺距0.54 nm（每残基升高0.15 nm）。\n② 氢键模式：第i个残基的C=O与第i+4个残基的N-H形成链内氢键，氢键方向大致平行于螺旋轴。\n③ 所有肽键的C=O和N-H均参与氢键（除两端3-4个残基），使α-螺旋非常稳定。\n④ 典型二面角：φ ≈ −57°, ψ ≈ −47°。\n⑤ 侧链R基指向螺旋外侧。\n\n【脯氨酸破坏α-螺旋的原因】\n① 脯氨酸是亚氨基酸，α-N原子参与吡咯环形成，缺少形成氢键所需的N-H基团。\n② 环状结构固定φ角（≈ −60°），在螺旋中引入\"扭结\"，破坏螺旋规整性。\n\n【甘氨酸破坏α-螺旋的原因】\n① 甘氨酸侧链仅为H原子，空间位阻极小，主链构象灵活性过高（Ramachandran图中允许区极大）。\n② 折叠成固定φ/ψ角的α-螺旋会造成较大的构象熵损失（ΔS为负且绝对值大），热力学上不利。", "explanation": "这道题是结构生物化学的经典简答题。需要全面掌握α-螺旋的结构参数和理解脯氨酸、甘氨酸的化学结构特点如何从不同角度破坏螺旋。", "pitfall": "①注意区分α-螺旋(3.6残基/圈)、3₁₀螺旋(3残基/圈、i→i+3)、π螺旋(4.4残基/圈、i→i+5)。②不要漏答氢键方向。③Pro和Gly破坏螺旋的原因不同——Pro是'结构刚性'问题，Gly是'结构柔性'问题——不能相互替代解释。"}, {"type": "short_answer", "points": 10, "question": "试述镰刀形细胞贫血的分子机制及其在分子医学史上的重要意义。", "answer": "【分子机制】\n① 基因突变：Hb β链第6位密码子GAG→GTG（A→T颠换），导致谷氨酸(Glu)突变为缬氨酸(Val)。\n② 结构改变：Glu侧链−CH₂−CH₂−COO⁻为亲水带电基团，位于HbS表面；Val侧链−CH(CH₃)₂为疏水基团。突变后在脱氧HbS分子表面产生一个\"黏性疏水补丁\"。\n③ 聚合过程：一个HbS分子的疏水补丁与另一个脱氧HbS分子β链上的疏水口袋（含Phe85、Leu88）互补结合→HbS分子线性多聚化→形成14条纤维拧成的纤维束→在红细胞内沉淀。\n④ 细胞后果：纤维束使红细胞从双凹圆盘形扭曲为镰刀形→变形性下降→通过微循环时破裂→溶血性贫血。同时镰刀形细胞堵塞毛细血管→组织缺氧/疼痛危象。\n⑤ 氧合HbS不发生聚合（疏水补丁被掩埋），因此脱氧是聚合的必要条件。\n\n【历史意义】\n① Linus Pauling于1949年发现HbS与HbA的电泳差异，首次将疾病归因于\"分子\"的异常，创造了\"分子病（molecular disease）\"概念。\n② Vernon Ingram于1956年用\"指纹图谱\"技术确定突变为Glu6→Val，首次将遗传病精确定位到单个氨基酸水平。\n③ 这一发现深刻验证了\"基因→蛋白质序列→蛋白质结构→蛋白质功能→表型\"的中心关系链，是现代分子医学的奠基石之一。", "explanation": "镰刀形细胞贫血是连接遗传学、生物化学和医学的经典范例，高频出现在各大高校考研试题中。需要从基因突变→氨基酸改变→蛋白质结构变化→聚合机制→细胞形态→临床症状逐级阐述。", "pitfall": "①突变是Glu→Val，不要写反。②是β链第6位，不是α链。③氧合HbS不聚合，是脱氧HbS才聚合——这是理解疾病间歇性发作的关键。④不要忘记阐述历史意义（Pauling + Ingram的贡献），这是常见踩分点。"}, {"type": "short_answer", "points": 10, "question": "列表比较五种常用蛋白质分离纯化方法（盐析、凝胶过滤层析、离子交换层析、SDS-PAGE、亲和层析）的分离原理和分离依据，并说明在实际纯化流程中这些方法的典型使用顺序。", "answer": "【方法比较】\n① 盐析：高盐竞争水合水→降低蛋白质溶解度→沉淀析出。分离依据：溶解度差异。常用硫酸铵分级沉淀。\n② 凝胶过滤层析：多孔凝胶珠筛分→大蛋白不进孔先洗脱，小蛋白进孔后洗脱。分离依据：分子大小（流体力学半径）。\n③ 离子交换层析：带电树脂与相反电荷蛋白结合→盐/pH梯度洗脱。分离依据：电荷差异（阳离子交换CM结合正电蛋白；阴离子交换DEAE结合负电蛋白）。\n④ SDS-PAGE：SDS变性并均匀结合蛋白→消除电荷差异→迁移率仅与分子量相关。分离依据：分子量。\n⑤ 亲和层析：固定化配体特异性结合目标蛋白→洗脱杂质→特异洗脱目标蛋白。分离依据：特异性生物识别（如抗原-抗体、酶-底物）。\n\n【典型纯化流程】\n① 粗提：组织匀浆→离心取上清→盐析（硫酸铵分级沉淀）→去除大量杂蛋白。\n② 脱盐：透析或凝胶过滤除盐、换缓冲液。\n③ 中度纯化：离子交换层析或疏水层析。\n④ 精细纯化：亲和层析（如果可用）或凝胶过滤层析。\n⑤ 纯度鉴定：SDS-PAGE检测纯度和分子量。\n\n总体原则：先低分辨率高容量（盐析），后高分辨率低容量（亲和层析）。每一步后检测比活性，直到比活性不再提高。", "explanation": "蛋白质纯化是生物化学实验的核心技能，考研常考各方法原理和流程设计。回答要点：每种方法四个字概括（原理+依据），流程体现逐步提高分辨率的逻辑。", "pitfall": "①盐析依据是溶解度而非分子量——虽然大分子蛋白质确实更易被盐析，但原理是竞争水合水。②凝胶过滤中大分子先出 vs SDS-PAGE中小分子先到——容易混淆。③不要遗漏亲和层析——它是唯一基于特异性识别而非物理化学性质差异的方法。④强调比活性监测——每一步后检测酶活性/总蛋白，计算比活性。"}, {"type": "short_answer", "points": 10, "question": "解释蛋白质折叠的热力学驱动力。为什么说疏水作用是蛋白质折叠的主要驱动力？氢键在折叠中的作用是什么？", "answer": "【折叠热力学概述】\n蛋白质从伸展态(U)折叠为天然态(N)：ΔG_fold = ΔH_fold − TΔS_fold。在生理条件下ΔG_fold通常为−20至−65 kJ/mol（较小的净稳定化自由能）。\n\n【疏水作用为主要驱动力】\n① 在伸展态中，非极性侧链周围的水分子被迫形成有序的\"笼状\"结构（冰山结构/笼形水合物），水分子熵降低（ΔS_w为负）。\n② 折叠时非极性侧链聚集到蛋白质内部形成疏水核心→原来被\"冻结\"在非极性表面周围的有序水分子被释放到本体溶液中→水分子熵大幅增加（ΔS_w为正且数值大）。\n③ 这个巨大的熵增是蛋白质折叠的主要热力学驱动力。ΔG疏水贡献约占总折叠自由能的60-80%。\n④ 从焓的角度：疏水核心中非极性基团间的范德华接触也贡献有利的ΔH。\n\n【氢键的作用】\n① 在伸展态中，主链C=O和N-H与水分子形成氢键（能量上有利）。\n② 折叠时这些基团间的氢键被蛋白质内部氢键（α-螺旋、β-折叠中的链内/链间氢键）替代，氢键的净焓变不大（原有氢键被新氢键替代）。\n③ 但未形成氢键的C=O或N-H埋在疏水环境中是高度不利的（ΔG约+20 kJ/mol/基团），因此所有内部极性基团必须形成氢键。\n④ 氢键的作用是\"定向和选择\"折叠路径——确保形成正确的二级结构和三级结构，而非提供主要的净自由能驱动力。", "explanation": "这是蛋白质化学中关于折叠热力学的核心问题，需要从疏水作用的熵驱动本质和氢键的'定向而非驱动'角色两个角度回答。", "pitfall": "①最常见的错误：认为氢键是蛋白质折叠的主要驱动力。氢键在天然态和伸展态中都存在（折叠态是蛋白内部氢键，伸展态是蛋白-水氢键），净焓变化不大。②疏水作用本质是熵驱动（水分子释放），不是非极性基团间的'吸引力'。③注意区分折叠的驱动力（疏水作用）与结构的稳定力（氢键、范德华力、盐桥等共同贡献）。"}, {"type": "single", "points": 4, "question": "B-DNA双螺旋的螺距（pitch）是多少？", "options": ["A. 0.34 nm", "B. 2.0 nm", "C. 3.4 nm", "D. 34 nm"], "answer": "C", "explanation": "B-DNA螺距为3.4 nm（34 Å），每圈含10.5个碱基对，相邻碱基对间距0.34 nm，直径2 nm。这些是碱基对堆积形成的宏观参数。", "pitfall": "3.4 nm和0.34 nm容易混淆——记住螺距=10×rise，即3.4 = 10 × 0.34。直径2 nm是另一个独立参数，并非螺距的一半。"}, {"type": "single", "points": 4, "question": "下列关于DNA碱基配对的说法，哪一项是正确的？", "options": ["A. A与C之间形成2个氢键", "B. G与C之间形成3个氢键，因此GC含量越高Tm越低", "C. A与T之间形成2个氢键，G与C之间形成3个氢键", "D. 碱基配对主要依靠磷酸二酯键维持"], "answer": "C", "explanation": "A=T形成2个氢键，G≡C形成3个氢键。GC含量越高，DNA越稳定，Tm值越高（而非越低）。碱基配对依靠氢键和碱基堆积力，磷酸二酯键连接的是核苷酸之间的糖-磷酸骨架。", "pitfall": "GC含量与Tm正相关，不是负相关——氢键越多越难解开，需要更高温度。这是选择题常见干扰项。"}, {"type": "single", "points": 4, "question": "Chargaff规则指出，在双链DNA中：", "options": ["A. [A] = [C], [G] = [T]", "B. [A] + [T] = [G] + [C]", "C. [A] = [T], [G] = [C], 且[A]+[G] = [T]+[C]", "D. DNA碱基组成在所有物种中都相同"], "answer": "C", "explanation": "Chargaff规则的核心：(1) A=T, G=C；(2) 嘌呤总数=嘧啶总数（A+G = T+C）。不同物种DNA碱基组成不同（物种特异性），但同一物种不同组织相同。", "pitfall": "选项B写的是A+T=G+C，这不对——应该是A+G = T+C（嘌呤=嘧啶）。A+T不一定等于G+C，GC含量因物种而异。"}, {"type": "single", "points": 4, "question": "DNA变性时发生的现象是：", "options": ["A. 磷酸二酯键断裂", "B. 氢键断裂，双链解开，A₂₆₀升高", "C. A₂₆₀吸光度降低", "D. 一级结构被破坏"], "answer": "B", "explanation": "DNA变性是指氢键断裂导致双链解开，不涉及共价键（磷酸二酯键）的断裂，一级结构保持完整。碱基从堆叠状态暴露出来导致增色效应（A₂₆₀升高约30-40%）。", "pitfall": "变性的本质是“解链”而非“降解”，不要混淆。A₂₆₀是升高（增色效应），不是降低。"}, {"type": "single", "points": 4, "question": "tRNA的三级结构是：", "options": ["A. 三叶草结构", "B. 倒L型结构", "C. 双螺旋结构", "D. β-折叠桶结构"], "answer": "B", "explanation": "tRNA的二级结构是“三叶草”结构（cloverleaf），三级结构（空间折叠后的最终形状）是倒L型。三叶草的四个臂在空间中折叠成倒L的形态。", "pitfall": "三叶草 = 二级结构（平面图），倒L型 = 三级结构（空间构象）。这是考研经典辨析题，极易混淆。"}, {"type": "judge", "points": 3, "question": "RNA由于2”位含有—OH基团，比DNA更容易被稀碱水解。", "answer": true, "explanation": "RNA的核糖2”位—OH可以邻近参与磷酸二酯键的碱催化水解（形成2”,3”-环状磷酸中间体），而DNA的2”-脱氧核糖无此—OH，对稀碱相对稳定。这是DNA作为遗传物质长期储存的化学优势。", "pitfall": ""}, {"type": "blank", "points": 4, "question": "核酸在______nm波长处有最大紫外吸收，这是由碱基的______系统所致。", "answer": "260; 共轭双键", "explanation": "嘌呤和嘧啶碱基含共轭双键系统，最大紫外吸收在260 nm。蛋白质的最大吸收在280 nm（来自Trp和Tyr）。A₂₆₀/A₂₈₀比值常用于判断核酸纯度。", "pitfall": "260 nm（核酸）vs 280 nm（蛋白质）是经典对比，注意不要颠倒。"}, {"type": "blank", "points": 4, "question": "所有tRNA分子的3”端均以______三核苷酸序列结尾，这是氨基酸的连接位点。", "answer": "CCA", "explanation": "tRNA的3”端CCA序列是高度保守的，氨基酸通过酯键连接到末端腺苷酸（A）的3”—OH上。部分tRNA的CCA是转录后添加的。", "pitfall": "注意是CCA（3”端），不是5”端。方向性很重要。"}, {"type": "single", "points": 4, "question": "在Fischer投影式中，D-葡萄糖的判定标准是：", "options": ["A. C1上的—OH在右边", "B. 离羰基最远的手性碳（C5）上的—OH在右边", "C. 所有—OH都在右边", "D. 旋光方向为右旋"], "answer": "B", "explanation": "D/L构型由离羰基最远的手性碳（葡萄糖为C5）上的—OH方向决定：在Fischer投影式中，—OH在右边为D，左边为L。天然单糖几乎都是D型。", "pitfall": "D/L ≠ d/l！D/L是构型标记（基于Fischer投影式），d/l是旋光方向（基于实验测定），两者没有必然对应关系。"}, {"type": "single", "points": 4, "question": "蔗糖没有还原性的原因是：", "options": ["A. 它是一种多糖", "B. 两个单糖的异头碳都参与了糖苷键的形成", "C. 它只含酮糖", "D. 它的糖苷键是β构型"], "answer": "B", "explanation": "蔗糖由葡萄糖（C1）和果糖（C2）通过α-1,2-β糖苷键连接，两个单糖的异头碳均参与了成键，溶液中没有游离异头碳可以开环转变为醛基，因此无还原性，斐林试剂检测呈阴性。", "pitfall": "蔗糖是唯一没有还原性的常见二糖。麦芽糖和乳糖各有1个游离异头碳，有还原性。记住：看游离异头碳的有无。"}, {"type": "single", "points": 4, "question": "人体不能消化纤维素，其根本原因是：", "options": ["A. 纤维素分子量太大", "B. 纤维素含α-1,4糖苷键，人体缺乏α-淀粉酶以外的α-糖苷酶", "C. 纤维素含β-1,4糖苷键，人体缺乏相应的β-1,4-葡聚糖酶", "D. 纤维素在水中不溶"], "answer": "C", "explanation": "纤维素由葡萄糖以β-1,4糖苷键连接而成，人体消化酶（如α-淀粉酶）只能水解α-糖苷键，缺乏能够水解β-1,4糖苷键的纤维素酶。反刍动物瘤胃中的共生微生物可产生纤维素酶。", "pitfall": "注意：纤维素是β-1,4，淀粉/糖原是α-1,4。一个β之差决定了能否被人体利用——考试常把α/β写反作为干扰项。"}, {"type": "single", "points": 4, "question": "下列哪种糖的糖苷键类型是α-1,4？", "options": ["A. 纤维素", "B. 乳糖", "C. 麦芽糖", "D. 蔗糖"], "answer": "C", "explanation": "麦芽糖由两分子葡萄糖以α-1,4糖苷键连接。纤维素是β-1,4，乳糖是β-1,4（半乳糖-葡萄糖），蔗糖是α-1,2-β。", "pitfall": "麦芽糖(α-1,4)、乳糖(β-1,4)和纤维素(β-1,4)的糖苷键类型容易记混。记忆诀窍：麦芽→α（“麦”和“α”像），乳糖→β（“乳”有弧度像β）。"}, {"type": "judge", "points": 3, "question": "D-葡萄糖和L-葡萄糖互为对映体，天然蛋白质中的氨基酸为L型，天然糖类为D型。", "answer": true, "explanation": "D-葡萄糖和L-葡萄糖互为镜像对映体（enantiomer）。自然界具有手性选择性：氨基酸几乎都是L型，单糖几乎都是D型。这一点在大分子识别中至关重要。", "pitfall": "注意：天然氨基酸=L型，天然单糖=D型——恰好相反。这是考研填空题/判断题的高频考点。"}, {"type": "blank", "points": 4, "question": "糖原与支链淀粉的结构相似，但糖原的分支更密集，平均每______个葡萄糖残基就有一个α-1,6分支点。", "answer": "8-12", "explanation": "糖原的分支密度（每8-12个残基一个分支点）高于支链淀粉（每24-30个残基一个分支点），高度分支化使糖原磷酸化酶能从多个非还原端同时释放葡萄糖，实现快速动员。", "pitfall": "糖原8-12，支链淀粉24-30——记住糖原更像“灌木”（分支密集），支链淀粉像“稀疏的树”。"}, {"type": "single", "points": 4, "question": "下列脂肪酸中，属于必需脂肪酸的是：", "options": ["A. 油酸(18:1)", "B. 棕榈酸(16:0)", "C. 亚油酸(18:2 ω-6)", "D. 硬脂酸(18:0)"], "answer": "C", "explanation": "必需脂肪酸是人体不能合成、必须从食物获取的脂肪酸，主要包括亚油酸（18:2 ω-6）和α-亚麻酸（18:3 ω-3）。人体缺乏在脂肪酸链的Δ9位以外引入双键的酶（缺乏Δ12和Δ15去饱和酶）。", "pitfall": "油酸(18:1 Δ⁹)人体可合成，不是必需脂肪酸。必需脂肪酸的共同特征：在ω端有双键（ω-6或ω-3系列）。"}, {"type": "single", "points": 4, "question": "下列关于生物膜中脂质运动的描述，哪项正确？", "options": ["A. 翻转运动（flip-flop）发生频率很高", "B. 侧向扩散速度远大于翻转运动", "C. 翻转运动不需要酶催化", "D. 脂质分子不能在膜平面内移动"], "answer": "B", "explanation": "侧向扩散在膜单层内非常快（≈10⁷次/秒），而翻转运动（flip-flop）极慢，无酶催化时半衰期可达数天到数周，需要flippase/floppase/scramblase等酶的催化。这是维持膜脂不对称性的关键。", "pitfall": "翻转运动≠侧向扩散。翻转是跨双层的（热力学不利），侧向是在同一单层内的（极快）。两者速度差可达10⁹倍以上。"}, {"type": "single", "points": 4, "question": "关于膜相变温度Tm，下列说法正确的是：", "options": ["A. 脂肪酸链越长，Tm越低", "B. 脂肪酸不饱和度越高，Tm越低", "C. 胆固醇使Tm升高", "D. Tm与脂肪酸组成无关"], "answer": "B", "explanation": "顺式双键在脂肪酸链中产生“扭结”（kink），使脂质堆积松散，降低相变温度。链越长→范德华力越强→Tm越高。胆固醇的作用是“缓冲”——使相变变得平缓而非升高或降低Tm。", "pitfall": "A反了：链越长Tm越高（更稳定）。C不准确：胆固醇是{LQ}缓冲调节{RQ}而非单纯升高。记住：不饱和=松散=低Tm；长链=紧密=高Tm。"}, {"type": "judge", "points": 3, "question": "整合膜蛋白（integral protein）可以通过高盐溶液从膜上去除。", "answer": false, "explanation": "整合膜蛋白深埋于脂双层中（或穿膜），其疏水区域与脂质疏水尾部相互作用，只有用去垢剂（detergent）破坏膜结构才能将其提取出来。高盐溶液只能去除外周膜蛋白（通过静电和氢键结合于膜表面）。", "pitfall": "整合蛋白=需要去垢剂；外周蛋白=高盐/pH变化即可去除。这是实验方法的经典考点。"}, {"type": "blank", "points": 4, "question": "胆固醇的甾核骨架结构为______，其分子具有两亲性：______基团为亲水头部。", "answer": "环戊烷多氢菲; 3β-羟基（或—OH/羟基）", "explanation": "胆固醇含环戊烷多氢菲（四环稠合甾核）+异辛基侧链，仅C3位有一个—OH（亲水头部），其余为疏水的甾环和侧链。这种极端的两亲性分布使其在膜中垂直排列，—OH朝向水相，甾环插入脂双层。", "pitfall": "胆固醇亲水部分仅一个—OH，疏水部分很大——因此它不是典型的“去垢剂”式两亲分子，而是膜的“流变性调节剂”。"}, {"type": "single", "points": 4, "question": "维生素B₁（硫胺素）的辅酶形式是：", "options": ["A. FAD", "B. NAD⁺", "C. TPP", "D. CoA"], "answer": "C", "explanation": "硫胺素（B₁）→ TPP（焦磷酸硫胺素），参与α-酮酸的氧化脱羧（如丙酮酸脱氢酶复合体中的E₁亚基）和磷酸戊糖途径中的转酮醇酶反应。", "pitfall": "B₁→TPP（脱羧），B₂→FAD（氧化还原），B₃→NAD（脱氢），B₅→CoA（酰基转移）。四种B族维生素的辅酶容易张冠李戴，需要建立各自的“记忆锚点”。"}, {"type": "single", "points": 4, "question": "在转氨反应中作为辅酶的化合物PLP来源于哪种维生素？", "options": ["A. 维生素B₁", "B. 维生素B₂", "C. 维生素B₃", "D. 维生素B₆"], "answer": "D", "explanation": "PLP（磷酸吡哆醛）来源于维生素B₆（吡哆醇/吡哆醛/吡哆胺），是所有转氨酶（aminotransferase）和许多氨基酸脱羧酶的辅酶。PLP与底物氨基酸形成Schiff碱中间体。", "pitfall": "B₆→PLP→转氨/脱羧，这是代谢章节的核心考点。B₁→TPP→脱羧（针对α-酮酸），B₆→PLP→转氨（针对氨基酸），两者都涉及{LQ}脱羧{RQ}但底物不同。"}, {"type": "single", "points": 4, "question": "唯一含有金属元素的维生素是：", "options": ["A. 维生素B₁", "B. 维生素B₆", "C. 维生素B₁₂", "D. 维生素C"], "answer": "C", "explanation": "维生素B₁₂（钴胺素）含有一个Co（钴）离子，位于咕啉环（corrin ring）的中心，是唯一含金属元素的维生素。Co可形成Co—C键，参与分子内重排（变位酶）和甲基转移反应。", "pitfall": "B₁₂中的金属是Co（钴）——不要与其他含金属的辅基混淆（如血红素含Fe、叶绿素含Mg）。这是“唯一性”考点，选择题特征明显。"}, {"type": "single", "points": 4, "question": "维生素K在体内的主要功能是：", "options": ["A. 抗氧化作用", "B. 参与视觉色素的形成", "C. 作为凝血因子γ-羧化的辅因子", "D. 促进钙的吸收"], "answer": "C", "explanation": "维生素K是γ-谷氨酰羧化酶的辅因子，催化凝血因子Ⅱ(凝血酶原)、Ⅶ、Ⅸ、Ⅹ中特定谷氨酸残基(Glu)的γ-羧化形成γ-羧基谷氨酸(Gla)，使其获得Ca²⁺结合能力，从而参与凝血级联反应。", "pitfall": "K→凝血（“K”可联想“K血”=koagulation）。D→钙吸收。E→抗氧化。A→视觉。四个脂溶性维生素功能各有侧重，不要搞混。"}, {"type": "blank", "points": 3, "question": "维生素B₇（生物素）是______酶的辅基，其功能是转移______。", "answer": "羧化; CO₂（或二氧化碳/一碳单位中的CO₂）", "explanation": "生物素共价连接于羧化酶的赖氨酸残基ε-氨基上，作为CO₂的载体。如丙酮酸羧化酶（糖异生关键酶）、乙酰CoA羧化酶（脂肪酸合成关键酶）等。生物素通过其脲基环与CO₂形成N-羧基生物素中间体。", "pitfall": "生物素转移的是CO₂（羧化），不是一碳单位（那是THF/Folate的功能）。这是两个容易混淆的“碳单元转移”体系。"}, {"type": "short", "points": 8, "question": "简述DNA双螺旋结构（Watson-Crick模型）的基本特征。（提示：从链的方向、碱基配对、沟结构、稳定力等方面回答）", "answer": "①两条多核苷酸链反向平行（一条5”→3”，另一条3”→5”），围绕同一轴右手螺旋。②糖-磷酸骨架在外侧（亲水），碱基对在内侧（疏水），碱基平面垂直于螺旋轴。③碱基互补配对：A=T（2个氢键），G≡C（3个氢键）。④螺旋表面形成大沟（major groove）和小沟（minor groove），大沟是蛋白质识别DNA序列的主要场所。⑤稳定力包括：碱基堆积力（疏水作用+范德华力，主要贡献）、氢键、离子键（磷酸基团与Mg²⁺等阳离子）。", "explanation": "B-DNA参数：螺距3.4 nm、每圈10.5 bp、直径2 nm、相邻碱基对间距0.34 nm。这些参数是理解DNA复制、转录和蛋白质-DNA识别的基础。", "pitfall": "注意区分{LQ}主要稳定力{RQ}：碱基堆积力（疏水+范德华）比氢键贡献更大，氢键主要贡献碱基配对的特异性（而非稳定性）。"}, {"type": "single_choice", "points": 3, "question": "下列关于酶的叙述，哪一项是<strong>错误</strong>的？", "options": ["A. 酶是生物催化剂，绝大多数化学本质是蛋白质", "B. 所有的酶都是蛋白质", "C. 核酶是具有催化活性的RNA", "D. 酶的催化效率远高于一般化学催化剂"], "answer": "B", "explanation": "核酶（ribozyme）的发现证明RNA也具有催化功能，因此'所有酶都是蛋白质'是错误的。Cech和Altman因发现核酶获得1989年诺贝尔化学奖。", "pitfall": "错误选C——核酶确实是RNA，C是正确的。注意题目问的是'错误'的叙述。"}, {"type": "single_choice", "points": 3, "question": "酶促反应中，酶的作用是？", "options": ["A. 改变反应的平衡常数", "B. 降低反应的活化能", "C. 增加反应的ΔG", "D. 改变反应的平衡点"], "answer": "B", "explanation": "酶通过稳定过渡态降低活化能（ΔG‡），从而加速反应速率，但不改变反应的平衡常数（Keq）和ΔG。这是酶的最基本特征。", "pitfall": "错误选A或D——酶不改变平衡常数和平衡点，只加速到达平衡的过程。"}, {"type": "single_choice", "points": 3, "question": "下列关于Km的叙述，哪一项是<strong>正确</strong>的？", "options": ["A. Km是ES复合物的解离常数", "B. Km与酶浓度有关", "C. Km是酶的特征常数，不同底物有不同的Km值", "D. Km越大表示酶与底物亲和力越大"], "answer": "C", "explanation": "Km是酶的特征常数（与酶浓度无关）。同一酶对不同底物的Km不同。Km越小表示亲和力越大。Km一般不等于Kd（除非kcat << k-1时）。", "pitfall": "错误选A——Km = (k-1 + kcat)/k1，而Kd = k-1/k1，只有在kcat << k-1时Km才近似等于Kd。错误选B——Km与[E]无关。错误选D——Km越小亲和力越大。"}, {"type": "single_choice", "points": 3, "question": "在Lineweaver-Burk双倒数作图中，竞争性抑制剂的动力学特征是？", "options": ["A. 直线交于Y轴同一点", "B. 直线交于X轴同一点", "C. 直线互相平行", "D. 直线交于原点"], "answer": "A", "explanation": "竞争性抑制剂Vmax不变、Km增大。在双倒数图中，Y截距=1/Vmax不变→所有直线交于Y轴同一点。X截距=−1/Km随抑制剂浓度增大而向原点移动。", "pitfall": "错误选B——交于X轴同一点是非竞争性抑制的特征（Km不变）。错误选C——平行线是反竞争性抑制的特征。三种抑制的双倒数图判别是每年必考内容。"}, {"type": "single_choice", "points": 3, "question": "磺胺类药物的抗菌机理是？", "options": ["A. 不可逆抑制细菌转肽酶", "B. 作为PABA的结构类似物，竞争性抑制二氢蝶酸合成酶", "C. 非竞争性抑制细菌DNA复制", "D. 反竞争性抑制细菌蛋白质合成"], "answer": "B", "explanation": "磺胺是对氨基苯甲酸（PABA）的结构类似物，竞争性地抑制细菌的二氢蝶酸合成酶，阻断叶酸合成。这是竞争性抑制的经典临床范例。人类细胞不合成叶酸（从食物获取），因此磺胺对人有选择性毒性。", "pitfall": "错误选A——有机磷农药才是不可逆抑制丝氨酸蛋白酶（胆碱酯酶）。磺胺是可逆竞争性抑制剂。"}, {"type": "single_choice", "points": 3, "question": "丝氨酸蛋白酶的催化三联体由哪三个残基组成？", "options": ["A. Ser-His-Asp", "B. Ser-His-Glu", "C. Cys-His-Asp", "D. Ser-Lys-Asp"], "answer": "A", "explanation": "催化三联体为Ser195-His57-Asp102（胰凝乳蛋白酶编号）。Asp的-COO⁻定向His咪唑环→His从Ser接受质子→Ser-O⁻作为亲核试剂攻击底物羰基碳。", "pitfall": "错误选B——是Asp而非Glu。错误选C——Cys-His-Asp是某些半胱氨酸蛋白酶的催化三联体（如caspase），不要与丝氨酸蛋白酶混淆。"}, {"type": "single_choice", "points": 3, "question": "别构酶通常表现出的v-[S]曲线形状是？", "options": ["A. 双曲线", "B. S形曲线", "C. 直线", "D. 指数曲线"], "answer": "B", "explanation": "别构酶具有多亚基结构和正协同效应，v-[S]曲线呈S形（sigmoidal）。S形曲线在中间底物浓度范围形成敏感的'开关区域'，使代谢调控更精准。M-M酶则呈双曲线。", "pitfall": "错误选A——双曲线是M-M酶的特征（无协同效应）。S形曲线的生物学意义是常考的简答题。"}, {"type": "single_choice", "points": 3, "question": "乳酸脱氢酶（LDH）同工酶中，主要分布在心肌的是？", "options": ["A. LDH₁ (H₄)", "B. LDH₃ (H₂M₂)", "C. LDH₅ (M₄)", "D. LDH₂ (H₃M)"], "answer": "A", "explanation": "LDH₁(H₄)主要分布在心肌和红细胞。心肌是有氧组织，LDH₁对丙酮酸Km小且被高浓度丙酮酸抑制，偏好乳酸→丙酮酸的方向。心肌梗死时血清LDH₁>LDH₂是诊断指标之一。", "pitfall": "错误选C——LDH₅(M₄)主要分布在骨骼肌和肝脏。错误选D——LDH₂也分布在心肌，但LDH₁含量最多且是临床诊断的指标。"}, {"type": "single_choice", "points": 3, "question": "下列哪种维生素的活性形式是辅酶A（CoA）？", "options": ["A. 维生素B₁", "B. 维生素B₂", "C. 维生素B₅（泛酸）", "D. 维生素B₆"], "answer": "C", "explanation": "泛酸（维生素B₅）是CoA的前体。CoA的-SH与酰基形成高能硫酯键，是酰基转移反应的关键辅酶。B₁→TPP，B₂→FAD/FMN，B₆→PLP。", "pitfall": "维生素与辅酶的对应关系是填空题和选择题的高频考点，需要准确记忆。"}, {"type": "single_choice", "points": 3, "question": "关于辅酶和辅基的区别，下列叙述正确的是？", "options": ["A. 辅酶是与酶蛋白共价结合的辅助因子", "B. 辅基可用透析法除去", "C. 辅酶与酶蛋白结合疏松，可用透析法除去", "D. 辅酶和辅基没有本质区别"], "answer": "C", "explanation": "辅酶与酶蛋白以非共价键疏松结合，可通过透析除去（如NAD⁺）。辅基与酶蛋白结合紧密（共价或极强非共价），不可透析除去（如生物素、血红素）。", "pitfall": "错误选A——辅酶是非共价疏松结合，辅基才是共价或紧密非共价结合。错误选B——辅基结合牢固，透析无法除去。"}, {"type": "true_false", "points": 2, "question": "酶只能加快反应速率，不能改变反应的平衡常数。", "answer": "正确", "explanation": "正确。酶通过降低活化能加速反应达到平衡的过程，但不改变反应的Keq和ΔG。这是酶的基本属性。", "pitfall": "这道题是正确的，不要因为题干看起来简单就怀疑自己。"}, {"type": "true_false", "points": 2, "question": "在非竞争性抑制中，Km不变但Vmax减小。", "answer": "正确", "explanation": "正确。非竞争性抑制剂结合在活性中心外，不影响底物与酶的结合（Km不变），但结合了抑制剂的酶分子无法催化（Vmax减小）。", "pitfall": "注意区分：竞争性=Km↑Vmax不变；非竞争性=Km不变Vmax↓；反竞争性=Km↓Vmax↓。"}, {"type": "true_false", "points": 2, "question": "Km是酶的特征常数，其值越大表示酶与底物的亲和力越大。", "answer": "错误", "explanation": "Km越大表示达到半饱和所需的底物浓度越高，即亲和力越小。Km与亲和力成反比关系。", "pitfall": "Km和亲和力的关系容易搞反——记住'小Km=大亲和力'（需要很少底物就能半饱和）。"}, {"type": "true_false", "points": 2, "question": "酶原激活是一种可逆的共价修饰调节方式。", "answer": "错误", "explanation": "酶原激活是通过蛋白质部分水解切除特定肽段来实现的，是不可逆的过程。可逆的共价修饰是磷酸化/去磷酸化、乙酰化/去乙酰化等。", "pitfall": "酶原激活≠共价修饰调节。共价修饰调节（如磷酸化）是可逆的；酶原激活（如胰蛋白酶原→胰蛋白酶）是通过蛋白水解断裂，不可逆。"}, {"type": "true_false", "points": 2, "question": "同工酶是由同一基因编码、经不同翻译后修饰产生的酶的不同形式。", "answer": "错误", "explanation": "同工酶由不同基因编码（如LDH的H亚基和M亚基分别由不同基因编码），具有不同的氨基酸序列。由同一基因经不同翻译后修饰产生的称为'酶的多种形式'，不是严格意义上的同工酶。", "pitfall": "同工酶的严格定义：不同基因编码+催化相同反应+不同理化性质。同一基因的翻译后修饰产物不是同工酶。"}, {"type": "fill_blank", "points": 4, "question": "Michaelis-Menten方程的推导基于两个关键前提：(1) ____，即d[ES]/dt = 0；(2) ____条件，即[S] >> [E]且[P] ≈ 0。", "answer": ["稳态假设", "初始速度"], "explanation": "稳态假设（steady-state assumption）是M-M方程推导的核心——ES的形成速率等于分解速率。初始速度条件保证了只考虑正向反应，忽略逆反应和底物消耗。", "pitfall": "第一空不要写成'平衡假设'——平衡假设（d[ES]/dt=0仅考虑k1/k-1平衡）是稳态假设的特例（当kcat<<k-1时）。M-M推导用的是更一般的稳态假设。"}, {"type": "fill_blank", "points": 4, "question": "在Lineweaver-Burk双倒数图中，Y轴截距等于____，X轴截距等于____。", "answer": ["1/Vmax", "-1/Km"], "explanation": "双倒数方程：1/v0 = (Km/Vmax)·(1/[S]) + 1/Vmax。当1/[S]=0时，Y=1/Vmax；当1/v0=0时，X=-1/Km。", "pitfall": "注意X截距是负值（-1/Km），不要忘记负号。"}, {"type": "fill_blank", "points": 4, "question": "酶活力的国际单位（IU）定义为在特定条件下每分钟催化转化____ μmol底物所需的酶量。Katal（kat）定义为每秒催化转化____ mol底物。", "answer": ["1", "1"], "explanation": "1 IU = 每分钟转化1 μmol底物。1 kat = 每秒转化1 mol底物。换算关系：1 kat = 6×10⁷ IU。", "pitfall": "IU是μmol/min级别，kat是mol/s级别。注意单位换算，1 kat = 6×10⁷ IU。"}, {"type": "fill_blank", "points": 4, "question": "丝氨酸蛋白酶催化肽键水解分两步：第一步是____阶段，形成酰基-酶中间体；第二步是____阶段，水分子亲核攻击释放产物。", "answer": ["酰化", "脱酰"], "explanation": "酰化阶段：Ser-O⁻攻击底物羰基→形成四面体过渡态→C端肽段离去→酰基-酶中间体。脱酰阶段：水分子被His活化→OH⁻攻击酰基-酶→释放N端肽段→酶恢复自由态。", "pitfall": "两个阶段顺序不要记反——先酰化（底物与酶共价连接），后脱酰（水解释放）。"}, {"type": "fill_blank", "points": 2, "question": "碳酸酐酶的活性中心含有金属离子____，它通过Lewis酸效应降低配位水分子的pKa，使其在生理pH下产生高浓度OH⁻作为亲核试剂。", "answer": "Zn²⁺", "explanation": "Zn²⁺的Lewis酸效应将配位水的pKa从15.7降至~7，在生理条件下产生高浓度OH⁻。这是金属离子催化的经典范例。", "pitfall": "注意是Zn²⁺，不是Mg²⁺。Mg²⁺在激酶中常见（与ATP配位）。碳酸酐酶的Zn²⁺催化CO₂+H₂O↔HCO₃⁻+H⁺。"}, {"type": "fill_blank", "points": 2, "question": "在乒乓机制（Ping-Pong机制）的双底物反应中，双倒数图呈现出____线的特征。", "answer": "平行", "explanation": "乒乓机制的双倒数图呈现平行线特征——这是由于第一个底物结合后先释放第一个产物，酶变为修饰形式，再与第二个底物反应。这与反竞争性抑制的双倒数图特征相同。", "pitfall": "乒乓机制的平行线≠反竞争性抑制的平行线——前者是多底物动力学，后者是单底物+抑制剂的动力学。虽然在双倒数图上都表现为平行线，但实验设计和解释完全不同。"}, {"type": "short_answer", "points": 8, "question": "请从双倒数图的特征、Km和Vmax的变化三个角度，对比竞争性抑制、非竞争性抑制和反竞争性抑制的动力学差异。", "answer": "【竞争性抑制】抑制剂与底物竞争活性中心。Km增大（表观亲和力下降），Vmax不变（高[S]可完全竞争赢抑制剂）。双倒数图：所有直线交于Y轴同一点（1/Vmax相同），X截距随[I]增大向原点移动。\n\n【非竞争性抑制】抑制剂结合在活性中心外，与E和ES均可结合。Km不变（不干扰底物结合），Vmax减小（部分酶分子永久失活）。双倒数图：所有直线交于X轴同一点（-1/Km相同），Y截距随[I]增大而增大。\n\n【反竞争性抑制】抑制剂仅与ES复合物结合。Km减小（ES被锁定使表观亲和力增大），Vmax减小。双倒数图：所有直线互相平行（斜率不变，Km和Vmax等比例减小）。", "explanation": "三种可逆抑制的动力学比较是考研的绝对必考点。评分关键：(1)准确描述每种抑制剂结合对象；(2)正确指出Km和Vmax变化方向；(3)准确描述双倒数图特征（交点位置）。三者缺一不可。", "pitfall": "容易混淆非竞争性和反竞争性：(1)非竞争性是结合E和ES，反竞争性仅结合ES；(2)非竞争性Km不变，反竞争性Km减小；(3)非竞争性交于X轴同一点，反竞争性是平行线。"}, {"type": "short_answer", "points": 8, "question": "简述丝氨酸蛋白酶的催化三联体组成及催化机制（以胰凝乳蛋白酶为例）。", "answer": "【催化三联体组成】Ser195-His57-Asp102。Asp102的-COO⁻通过氢键定向His57的咪唑环→His57从Ser195的-OH接受质子→Ser195变为强亲核试剂Ser-O⁻。\n\n【催化机制——两步共价催化】\n(1) 酰化阶段：Ser195-O⁻亲核攻击底物肽键的羰基碳→形成四面体过渡态（氧负离子穴中Gly193和Ser195的主链NH稳定此过渡态）→C端肽段离去（His57给离去基团-NH提供质子）→形成酰基-酶中间体（Ser195的O与底物N端以酯键连接）。\n(2) 脱酰阶段：水分子进入活性中心→His57从水接受质子→OH⁻攻击酰基-酶中间体→第二次四面体过渡态→释放N端肽段→酶恢复自由态。\n\n【底物特异性】三种丝氨酸蛋白酶催化机制相同，但S1口袋结构不同决定了底物特异性：胰凝乳蛋白酶偏好Phe/Tyr/Trp（深疏水口袋），胰蛋白酶偏好Lys/Arg（底部有Asp189负电），弹性蛋白酶偏好Gly/Ala（入口被Val/Thr封闭）。", "explanation": "评分要点：①催化三联体每个残基的具体角色（不能只说名字）；②两步机制+酸-碱-共价催化的协同；③氧负离子穴的作用；④底物特异性的结构基础。", "pitfall": "常见失误：(1)把催化三联体写成Ser-His-Glu（是Asp不是Glu）；(2)忽略了氧负离子穴；(3)把两步顺序搞反（先酰化后脱酰）。"}, {"type": "short_answer", "points": 6, "question": "什么是别构调节？别构酶的v-[S]曲线为什么呈S形？S形曲线有什么生理意义？", "answer": "【定义】别构调节是指效应物（激活剂或抑制剂）结合在酶活性中心以外的别构位点，通过引起酶构象变化来调控催化活性的方式。别构酶通常具有多亚基结构（四级结构）。\n\n【S形曲线原因】别构酶各亚基之间存在正协同效应（positive cooperativity）：第一个底物分子结合后，通过构象变化使相邻亚基对底物的亲和力增大→第二个底物更容易结合→第三个更易……这种协同效应使v-[S]曲线偏离M-M双曲线，呈现S形。\n\n【生理意义】S形曲线在中间底物浓度范围形成陡峭的'开关区域'——在此区域内底物浓度的微小变化即可引起反应速率的剧烈改变。这使酶能对代谢物浓度的细微波动做出灵敏响应，实现精准的代谢调控。相比之下，M-M酶的双曲线在生理底物浓度范围内更像'渐变调光器'，缺乏这种开关式调控能力。", "explanation": "评分要点：(1)别构调节的定义（别构位点≠活性中心）；(2)正协同效应导致S形曲线；(3)S形曲线的生理意义（灵敏度+开关效应）。", "pitfall": "别构酶必须是多亚基的（具有四级结构），单亚基酶不可能有别构效应。S形曲线不是所有多亚基酶都有——只有存在正协同效应时才呈S形。"}, {"type": "short_answer", "points": 5, "question": "什么是同工酶？以乳酸脱氢酶（LDH）为例，说明同工酶的组成、组织分布差异及其生理意义。", "answer": "【定义】同工酶（isozyme）是指催化相同化学反应，但由不同基因编码、具有不同氨基酸序列和理化性质的酶。\n\n【LDH同工酶】LDH是由H亚基（心肌型）和M亚基（骨骼肌型）组成的四聚体，共5种：LDH₁(H₄)、LDH₂(H₃M)、LDH₃(H₂M₂)、LDH₄(HM₃)、LDH₅(M₄)。\n\n【组织分布差异】心肌中LDH₁(H₄)为主，对丙酮酸Km小（高亲和力）且被高浓度丙酮酸抑制→心肌是有氧组织，偏好乳酸→丙酮酸方向；骨骼肌中LDH₅(M₄)为主，对丙酮酸Km大且不被抑制→剧烈运动时大量丙酮酸可快速转化为乳酸。\n\n【临床意义】心肌梗死时血清LDH₁>LDH₂（正常是LDH₂>LDH₁）→可作为心梗诊断指标。肝脏疾病时LDH₅升高。", "explanation": "评分要点：(1)同工酶定义（不同基因编码+相同反应）；(2)LDH五种同工酶的亚基组成；(3)LDH₁和LDH₅的Km差异和生理意义；(4)临床诊断应用。", "pitfall": "LDH₁和LDH₅的Km对比是考点——LDH₁对丙酮酸Km小（高亲和力），LDH₅对丙酮酸Km大（低亲和力）。心梗时LDH₁释放入血导致LDH₁>LDH₂（翻转现象）。"}, {"type": "short_answer", "points": 5, "question": "简述核酶（ribozyme）的发现及其生物学意义。", "answer": "【发现】1982年，Thomas Cech发现四膜虫rRNA前体在完全无蛋白质的条件下可以自我剪接，证明RNA具有催化功能。同年，Sidney Altman发现RNase P中的RNA组分是真正的催化剂。两人共享1989年诺贝尔化学奖。\n\n【生物学意义】\n(1) 打破了'酶=蛋白质'的传统教条，证明RNA也可以是生物催化剂。\n(2) 为'RNA世界'假说提供了关键实验证据——在生命起源早期，RNA可能同时承担遗传信息存储（类似DNA）和催化功能（类似蛋白质酶）。\n(3) 核糖体的肽酰转移酶中心完全由rRNA组成（最近的蛋白质在18Å外），说明蛋白质合成机器本质上也是核酶——生命的最后共同祖先（LUCA）的蛋白质合成可能由RNA完成。", "explanation": "评分要点：(1)发现者和年代（Cech 1982，诺贝尔奖1989）；(2)'酶不全是蛋白质'的概念突破；(3)RNA世界假说的意义。", "pitfall": "不要把Cech和Altman搞混——Cech发现的是自我剪接rRNA（I类内含子），Altman发现的是RNase P的RNA催化组分。两人并列获奖。"}, {"type": "short_answer", "points": 8, "question": "【综合分析题】某研究生用一种新合成的化合物X进行酶抑制实验，得到以下数据：不含抑制剂时Km=2.0×10⁻⁵ M，Vmax=100 μmol/min；含抑制剂X时Km=2.0×10⁻⁵ M，Vmax=50 μmol/min。请判断：(1)化合物X属于哪种类型的可逆抑制剂？(2)在Lineweaver-Burk双倒数图上，有抑制剂和无抑制剂时的两条直线有何特征关系？(3)如果增加底物浓度到原来的10倍，能否完全恢复酶活？为什么？", "answer": "(1) 非竞争性抑制剂。判断依据：加入抑制剂后Km不变（仍为2.0×10⁻⁵ M），Vmax从100降至50 μmol/min——符合非竞争性抑制的动力学特征（Km不变，Vmax减小）。\n\n(2) 在双倒数图上，两条直线交于X轴同一点（-1/Km）。因为Km不变，X截距相同；而Vmax不同，Y截距（1/Vmax）不同：无抑制剂时Y截距=0.01，有抑制剂时Y截距=0.02。\n\n(3) 不能完全恢复。因为非竞争性抑制剂结合在活性中心外的位点，与E和ES均可结合——抑制剂的存在会使一部分酶分子永久性地失活（即使所有剩余酶分子被底物饱和，Vmax也只能达到无抑制剂时的50%）。增加底物浓度只能使不被抑制的酶分子饱和，但无法'挤走'已经结合在别构位点的抑制剂。", "explanation": "这是一道典型的实验数据分析题，考察从数据逆推抑制类型的能力。核心判断依据：(1)Km不变→排除竞争性(Km↑)和反竞争性(Km↓)；(2)Vmax减小→确定为非竞争性抑制。", "pitfall": "容易混淆：(1)看到Vmax减小就以为是反竞争性——但反竞争性Km也减小；(2)认为增加底物浓度可以恢复酶活——只有竞争性抑制才能被高底物浓度逆转。"}, {"type": "choice", "points": 3, "question": "关于水溶性与脂溶性激素，以下描述正确的是？", "options": ["水溶性激素的受体位于胞内，脂溶性激素的受体位于膜上", "水溶性激素需要第二信使，脂溶性激素直接调控基因转录", "甲状腺激素是水溶性激素", "脂溶性激素的响应速度比水溶性激素快"], "answer": 1, "explanation": "水溶性激素不能穿越质膜，受体在膜上，需要第二信使传递信号，响应快（秒-分钟）。脂溶性激素穿越质膜与胞内受体（核受体）结合，直接调控基因转录，响应慢（小时-天）。甲状腺激素虽然来自氨基酸（酪氨酸衍生物），但碘原子的引入使其具有脂溶性。", "pitfall": "甲状腺激素T₃/T₄虽然和肾上腺素一样是酪氨酸衍生物，但它是脂溶性的——因为碘原子的引入显著增加了疏水性。这是一个经典混淆点。"}, {"type": "choice", "points": 3, "question": "异三聚体G蛋白激活后，Gα亚基上结合的是哪一分子的核苷酸？", "options": ["GDP", "GTP", "ATP", "cAMP"], "answer": 1, "explanation": "激活态Gα结合GTP（Gα·GTP）。静息态结合GDP（Gα·GDP）。激活过程是GDP被GTP置换。Gα的固有GTP酶活性将GTP水解为GDP，使G蛋白回到静息态——这是GPCR信号终止的基本机制。", "pitfall": "注意区分：Gα·GTP=激活态，Gα·GDP=静息态。不要与G蛋白的类型(Gαs/Gαi/Gαq)混淆。激活/静息取决于结合的核苷酸是GTP还是GDP。"}, {"type": "multi", "points": 3, "question": "以下哪些属于第二信使？（多选）", "options": ["cAMP", "肾上腺素", "IP₃", "DAG"], "answer": [0, 2, 3], "explanation": "cAMP、IP₃和DAG都是第二信使（胞内信号分子）。肾上腺素是第一信使（胞外信号分子/激素），作用于细胞膜表面的GPCR。", "pitfall": "第一信使=胞外的信号分子（激素、神经递质等）；第二信使=胞内信号分子（cAMP、cGMP、IP₃、DAG、Ca²⁺）。区分的关键是看它们在胞外还是胞内发挥作用。"}, {"type": "choice", "points": 3, "question": "cAMP信号通路中，PKA的激活机制是？", "options": ["cAMP直接磷酸化PKA", "cAMP结合调节亚基(R)→R₂C₂解离→催化亚基(C)释放", "cAMP使PKA从胞质转移到细胞核", "cAMP被PKA水解产生激活效应"], "answer": 1, "explanation": "静息态PKA是四聚体R₂C₂，两个调节亚基(R)抑制两个催化亚基(C)。cAMP与R亚基结合→R亚基构象变化→R₂C₂解离→C亚基游离并磷酸化下游靶蛋白。这是一个别构激活的经典机制，不是共价修饰。", "pitfall": "PKA的激活是「别构激活」（cAMP结合R→R-C解离），不是「磷酸化激活」。PKA本身以去磷酸化状态就有活性，只是被R亚基挡住了活性位点。"}, {"type": "choice", "points": 3, "question": "IP₃/DAG双信使通路中，IP₃和DAG的来源是？", "options": ["ATP的水解产物", "磷脂酶C(PLC)水解PIP₂", "腺苷酸环化酶催化ATP", "磷脂酶A₂水解磷脂"], "answer": 1, "explanation": "Gαq激活磷脂酶C(PLC)，PLC水解质膜内层的磷脂酰肌醇-4,5-二磷酸(PIP₂)，产生IP₃（水溶性，释放Ca²⁺）和DAG（脂溶性，激活PKC）。", "pitfall": "PIP₂→IP₃+DAG（PLC催化），ATP→cAMP（AC催化），GTP→cGMP（GC催化）。三对信使、三种来源、三种合成酶，容易混淆，需要分开记忆。"}, {"type": "choice", "points": 3, "question": "RTK→Ras→MAPK级联的正确顺序是？", "options": ["RTK二聚化→Ras→Raf→MEK→ERK", "RTK二聚化→自磷酸化→Grb2/SOS→Ras→Raf→MEK→ERK", "RTK→PLC→Ras→Raf→ERK", "RTK→Gα→AC→Ras→MAPK"], "answer": 1, "explanation": "完整顺序：配体诱导RTK二聚化→自磷酸化→Grb2(SH2)识别磷酸酪氨酸，Grb2(SH3)招募SOS→SOS(GEF)促进Ras释放GDP结合GTP→Ras·GTP激活Raf→Raf激活MEK→MEK激活ERK→ERK入核磷酸化转录因子。", "pitfall": "RTK不经过G蛋白（那是GPCR的通路）！RTK通过接头蛋白(Grb2/SOS)直接激活Ras（小G蛋白）。Ras→Raf→MEK→ERK是MAPK级联，各级命名规则：MAPKKK→MAPKK→MAPK。"}, {"type": "short", "points": 5, "question": "简述G蛋白偶联受体(GPCR)信号转导中G蛋白的GTP/GDP循环过程。", "answer": -1, "explanation": "<strong>参考答案：</strong><br><br>(1) <strong>静息态</strong>：Gα·GDP与Gβγ形成异三聚体（Gαβγ），信号关闭。(2分)<br><br>(2) <strong>激活</strong>：配体结合GPCR→GPCR构象变化→GPCR作为GEF促进Gα释放GDP→GTP结合到Gα→Gα·GTP与Gβγ解离→Gα·GTP和Gβγ各自激活下游效应器。(2分)<br><br>(3) <strong>终止</strong>：Gα的固有GTP酶活性将GTP水解为GDP→Gα·GDP重新与Gβγ结合→恢复静息三聚体状态。(2分)<br><br>霍乱毒素抑制Gαs的GTP酶活性→Gαs·GTP持续激活→cAMP持续升高。百日咳毒素阻止Gαi被受体激活→Gαi无法抑制AC→cAMP升高。", "pitfall": "常见丢分点：(1) 混淆GDP和GTP谁在静息态谁在激活态；(2) 遗漏Gβγ在信号转导中也发挥作用（不仅Gα）；(3) 遗漏G蛋白循环的终止环节——GTP水解是信号终止的关键。"}, {"type": "choice", "points": 3, "question": "Na⁺-K⁺ ATP酶每水解1分子ATP，跨膜转运的离子数量是？", "options": ["泵出2Na⁺，泵入3K⁺", "泵出3Na⁺，泵入2K⁺", "泵出3Na⁺，泵入3K⁺", "泵出1Na⁺，泵入1K⁺"], "answer": 1, "explanation": "Na⁺-K⁺ ATP酶的化学计量比是：3Na⁺出 / 2K⁺进 / 1ATP。每个循环净移出1个正电荷（生电性泵），维持细胞膜电位（约-70mV）和渗透平衡。", "pitfall": "3出/2进=净出1正电荷。这是最核心的数字，考试常考。哇巴因(ouabain)是该酶的经典抑制剂。"}, {"type": "choice", "points": 3, "question": "以下哪种运输方式属于次级主动运输？", "options": ["GLUT1转运葡萄糖进入红细胞", "Na⁺/葡萄糖同向转运(SGLT1)将葡萄糖吸收进小肠上皮细胞", "Na⁺-K⁺ ATP酶维持细胞Na⁺/K⁺梯度", "K⁺通道介导K⁺外流"], "answer": 1, "explanation": "SGLT1利用Na⁺-K⁺ ATP酶建立的Na⁺电化学梯度（Na⁺顺梯度流入），将葡萄糖逆梯度运入细胞。这不直接消耗ATP，但间接依赖ATP——属于次级主动运输。GLUT1是协助扩散，Na⁺-K⁺ ATP酶是初级主动运输，K⁺通道是协助扩散。", "pitfall": "区分初级和次级主动运输：初级=直接水解ATP（Na⁺-K⁺ ATP酶），次级=利用离子梯度（SGLT），两者都逆浓度梯度运输，但从ATP到离子梯度到葡萄糖是「两步走」。"}, {"type": "tf", "points": 2, "question": "离子通道的转运速率比载体蛋白慢，因为通道需要经历构象变化。", "answer": 1, "explanation": "错误。离子通道的转运速率(~10⁶-10⁸ ions/s)远快于载体蛋白(~10²-10⁴ molecules/s)，快了约1000倍。通道仅需「开/关」切换而不经历底物结合-构象变化-释放的催化循环。", "pitfall": "恰恰相反——通道快、载体慢。通道是一次开一个孔让离子自由通过，载体需要结合→构象变化→释放的完整催化循环，速率受限于构象变化频率。"}, {"type": "tf", "points": 2, "question": "GLUT4转运葡萄糖是主动运输过程，需要消耗ATP。", "answer": 1, "explanation": "错误。GLUT4是葡萄糖协助扩散转运体，不消耗ATP，顺浓度梯度转运。但GLUT4的「上膜」（囊泡从胞内转移到质膜）是受胰岛素信号调控的——这个调控过程消耗能量，但GLUT4本身转运葡萄糖时不耗能。", "pitfall": "GLUT1-4都是协助扩散（不耗能）！小肠的SGLT1才是Na⁺依赖的次级主动运输。GLUT的「胰岛素调控」指的是GLUT4的上膜/回收的动态调控过程需要信号转导（消耗能量），而非转运本身需能。"}, {"type": "fill", "points": 3, "question": "离子的跨膜运输方式中，____运输直接消耗____以逆浓度梯度泵出离子；____运输利用另一种溶质的____能量间接驱动逆浓度运输；____扩散通过通道或载体顺浓度梯度运输，不消耗能量。（依次填入）", "answer": [["初级主动"], ["ATP"], ["次级主动"], ["电化学梯度"], ["协助"]], "explanation": "三种基本运输方式：初级主动运输直接消耗ATP（如Na⁺-K⁺ ATP酶），次级主动运输利用离子梯度（如SGLT），协助扩散顺梯度不耗能（如GLUT）。", "pitfall": "注意区分次级主动运输和协助扩散——两者都涉及载体/通道蛋白，但次级主动运输逆梯度（间接耗能），协助扩散顺梯度（不耗能）。"}, {"type": "choice", "points": 3, "question": "ΔG°'(标准生化自由能变化)与平衡常数K'eq的关系是？", "options": ["ΔG°' = K'eq × RT", "ΔG°' = -RT ln K'eq", "ΔG°' = -RT / K'eq", "ΔG°' = RT × ln K'eq"], "answer": 1, "explanation": "在平衡时ΔG=0，Q=K'eq，代入ΔG=ΔG°'+RT ln Q得：ΔG°'=-RT ln K'eq。R=8.314 J/(mol·K)，T=298K。ΔG°'的负值越大→K'eq越大→反应越趋于完全。", "pitfall": "记住负号！ΔG°'=-RT ln K'eq。如果K'eq>1（平衡偏向产物），ln K'eq为正，ΔG°'为负（自发）。"}, {"type": "choice", "points": 3, "question": "ATP水解的ΔG°'约为-30.5 kJ/mol，为什么ATP被称为「能量货币」？最准确的解释是？", "options": ["ATP含有最高能的化学键", "ATP的磷酸基团转移势能居中——既能被分解代谢合成，又能为合成代谢提供能量", "ATP是非可再生的唯一能量形式", "ATP的浓度在细胞内最高"], "answer": 1, "explanation": "ATP不是磷酸化合物的最高能量形式（PEP的ΔG°'=-61.9 kJ/mol），也不是最低的。ATP恰好居中——比低能磷酸酯（如葡萄糖-6-磷酸，-13.8 kJ/mol）高，比超高能化合物（PEP）低。这个中间位置使它既能被代谢途径轻松合成（从ADP+Pi），又能为大多数需能反应提供足够的驱动力。", "pitfall": "「高能磷酸键」不是说键能特别高，而是说水解反应的ΔG°'很大（绝对值大）——因为产物的共振稳定化和静电排斥的解除，产物比反应物稳定得多。"}, {"type": "choice", "points": 3, "question": "ATP水解具有较大负ΔG°'的主要原因是什么？", "options": ["ATP中的磷酸酐键键能特别高", "ATP水解产物的共振稳定化、静电排斥解除和更好的溶剂化", "ATP在水溶液中不稳定", "ATP的浓度极低"], "answer": 1, "explanation": "ATP水解ΔG°'大的三个原因：(1) 静电排斥减轻（ATP有4个负电荷集中，水解后ADP和Pi各带负电分开）；(2) 共振稳定化（游离Pi有更多共振形式）；(3) 更好的溶剂化（ADP和Pi比ATP更容易被水分子水合）。", "pitfall": "不是因为磷酸酐键的「键能特别高」——键能本身适中。ΔG°'大是因为产物比反应物稳定得多。同样道理，PEP的ΔG°'最大(-61.9)是因为烯醇式→酮式的互变异构释放大量能量，不是磷酸键本身多强。"}, {"type": "choice", "points": 3, "question": "能荷(Energy Charge)的计算公式是？", "options": ["[ATP] / ([ATP]+[ADP]+[AMP])", "([ATP]+[ADP]) / ([ATP]+[ADP]+[AMP])", "([ATP]+0.5[ADP]) / ([ATP]+[ADP]+[AMP])", "[ATP] / [ADP]"], "answer": 2, "explanation": "能荷 EC = ([ATP] + 0.5[ADP]) / ([ATP]+[ADP]+[AMP])。ADP的权重是0.5因为它只有一个高能磷酸酐键。EC范围0～1，正常细胞0.85-0.90。EC调控分解代谢和合成代谢的平衡。", "pitfall": "ADP的系数是0.5（不是1），因为ADP只有一个高能磷酸酐键（γ-β），而ATP有两个（γ-β和β-α）。试题可能把0.5换成1来迷惑你。"}, {"type": "short", "points": 6, "question": "解释偶联反应的原理：为什么己糖激酶能催化葡萄糖+G6P这个ΔG°'>0的反应？", "answer": -1, "explanation": "<strong>参考答案：</strong><br><br>葡萄糖 + Pi → G6P + H₂O 的ΔG°' = +13.8 kJ/mol（不利反应，不能自发进行）(1分)。<br><br>体内实际反应是：葡萄糖 + ATP → G6P + ADP（ΔG°' = -16.7 kJ/mol）(1分)。<br><br>这是偶联反应的典型——不是「先水解ATP再磷酸化葡萄糖」，而是ATP的γ-磷酸基团直接转移到葡萄糖上（通过己糖激酶的催化），形成一个反应序列。总ΔG°' = ΔG°'(G6P水解) + ΔG°'(ATP水解) = +13.8 + (-30.5) = -16.7 kJ/mol，热力学上变得有利(2分)。<br><br>关键理解：偶联通过「共同化学中间体」（磷酸基团转移）实现，而不是ATP水解「释放能量」再被「利用」——热是弥散的，不能定向驱动反应(1分)。", "pitfall": "不能写成「ATP水解放出能量，推动葡萄糖磷酸化」——这在热力学上不准确。偶联的实质是形成共同中间体，两个反应合并为一条反应路径。"}, {"type": "choice", "points": 3, "question": "以下哪一组呼吸链组分的电子传递顺序是正确的？", "options": ["NADH→CoQ→Cyt c→复合体I→O₂", "NADH→复合体I→CoQ→复合体III→Cyt c→复合体IV→O₂", "NADH→复合体II→CoQ→复合体III→Cyt c→复合体I→O₂", "FADH₂→复合体I→CoQ→复合体IV→O₂"], "answer": 1, "explanation": "正确顺序：NADH→复合体I→CoQ→复合体III→Cyt c→复合体IV→O₂。FADH₂进入点在复合体II（即琥珀酸脱氢酶），然后→CoQ→复合体III→Cyt c→复合体IV→O₂。", "pitfall": "(1) 复合体II不是NADH的入口——它是FADH₂（来自琥珀酸氧化）的入口；(2) Cyt c位于复合体III和IV之间；(3) 复合体IV是最后一个复合体，最终将电子传给O₂。"}, {"type": "choice", "points": 3, "question": "以下哪一对抑制剂与靶点的匹配是错误的？", "options": ["鱼藤酮 — 复合体I", "抗霉素A — 复合体III", "CN⁻ — 复合体II", "寡霉素 — ATP合酶(F₀)"], "answer": 2, "explanation": "CN⁻（氰化物）、CO和N₃⁻抑制复合体IV（细胞色素c氧化酶），不是复合体II。鱼藤酮→复合体I，抗霉素A→复合体III，寡霉素→ATP合酶(F₀)。", "pitfall": "CN⁻/CO的靶点是复合体IV（与Cyt a₃结合），这是最致命的抑制剂——因为O₂是终端受体，被阻断后整个呼吸链无法运转。"}, {"type": "choice", "points": 3, "question": "化学渗透假说的核心内容是什么？", "options": ["电子传递和ATP合成通过高能化学中间体(X~P)耦合", "电子传递将H⁺泵出线粒体内膜→形成质子电化学梯度→H⁺经ATP合酶回流驱动ATP合成", "ATP合酶直接消耗O₂产生ATP", "NADH直接磷酸化ADP产生ATP"], "answer": 1, "explanation": "Mitchell的化学渗透假说（1978年诺贝尔化学奖）核心：电子传递和ATP合成通过跨膜的质子电化学梯度（ΔμH⁺）间接耦合——不通过「高能化学中间体」。三个必要条件：内膜对H⁺不通透、电子传递泵H⁺、H⁺经ATP合酶回流。", "pitfall": "这个假说的关键是「间接耦合」——电子传递链和ATP合酶是物理分离的，通过H⁺梯度连接。解偶联剂(DNP)消除H⁺梯度后，电子传递继续但ATP不合成，这直接证明了两个过程是可分离的。"}, {"type": "choice", "points": 3, "question": "ATP合酶的F₁部分中，负责催化ATP合成的亚基是？", "options": ["α亚基", "β亚基", "γ亚基", "c亚基"], "answer": 1, "explanation": "F₁的β亚基是催化亚基（3个β亚基在γ轴旋转时依次经历O→L→T→O构象循环，T态合成ATP）。γ亚基是不对称中心轴（旋转驱动），α亚基是结构亚基（提供支撑），c亚基属于F₀（质子通道的旋转环）。", "pitfall": "注意区分：F₁催化头部=α₃β₃γδε（β是催化亚基），F₀质子通道=a+c环。γ轴的旋转被β亚基感知并转化为构象变化，ATP在β亚基的T态合成。"}, {"type": "tf", "points": 2, "question": "鱼藤酮同时阻断来自NADH和FADH₂的电子传递。", "answer": 1, "explanation": "错误。鱼藤酮仅阻断复合体I（NADH→CoQ的电子传递）。FADH₂通过复合体II进入呼吸链（在复合体I下游的CoQ处汇入），鱼藤酮不阻断FADH₂→复合体II→CoQ→III→IV→O₂的电子传递。", "pitfall": "区分不同抑制剂的阻断范围：鱼藤酮=阻断NADH来源的电子；抗霉素A和CN⁻=阻断全部电子传递（因为它们在复合体I和II交汇后的下游）。"}, {"type": "short", "points": 4, "question": "解释为什么NADH氧化产生约2.5个ATP，而FADH₂氧化仅产生约1.5个ATP。", "answer": -1, "explanation": "<strong>参考答案：</strong><br><br>关键原因是「进入点的差异」导致「泵出的H⁺数量不同」。(1分)<br><br>NADH的电子从复合体I进入呼吸链→经过复合体I、III、IV三个质子泵，共泵出约10个H⁺→ATP合酶每合成1个ATP需要约4个H⁺回流→10÷4≈2.5 ATP。(2分)<br><br>FADH₂的电子从复合体II（琥珀酸脱氢酶）进入→不经过复合体I，只经过复合体III和IV两个质子泵，共泵出约6个H⁺→6÷4≈1.5 ATP。(2分)", "pitfall": "(1) 复合体II本身不是质子泵！(2) 不是所有电子传递组分都能泵H⁺——只有复合体I、III、IV是质子泵；(3) 这解释了为什么1分子葡萄糖完全氧化产生约30-32 ATP（而非旧教科书的36-38）。"}, {"type": "choice", "points": 3, "question": "光合作用Z方案中，光系统I(PSI)反应中心的色素是？", "options": ["P680", "P700", "叶绿素b", "类胡萝卜素"], "answer": 1, "explanation": "PSI反应中心是P700（最大吸收700nm），PSII反应中心是P680（最大吸收680nm）。两者都是特殊的叶绿素a二聚体。", "pitfall": "PSII=P680（短波长=更高能量），PSI=P700（长波长=较低能量）。「II在先，I在后」的命名是按发现顺序，不是按电子传递顺序——实际上电子先经过PSII再经过PSI。"}, {"type": "choice", "points": 3, "question": "Calvin循环的三个阶段依次是？", "options": ["还原→羧化→再生", "羧化→还原→再生", "羧化→再生→还原", "再生→羧化→还原"], "answer": 1, "explanation": "Calvin循环三阶段：(1) 羧化——CO₂与RuBP反应（RuBisCO催化），生成2分子3-PGA；(2) 还原——3-PGA经磷酸化和还原生成G3P（消耗ATP和NADPH）；(3) 再生——G3P经碳骨架重排再生RuBP。每3轮循环净合成1分子G3P。", "pitfall": "「羧化→还原→再生」的顺序不可颠倒。每净合成1分子G3P消耗9ATP+6NADPH——这些数字是高频考点。"}, {"type": "choice", "points": 3, "question": "关于C4植物与C3植物的比较，以下描述正确的是？", "options": ["C4植物在高温干旱条件下光合效率低于C3植物", "C4植物的RuBisCO存在于叶肉细胞中", "C4植物的Kranz结构包括叶肉细胞和维管束鞘细胞两层", "C4植物的光呼吸比C3植物更强烈"], "answer": 2, "explanation": "C4植物有Kranz结构——叶肉细胞+维管束鞘细胞呈双层同心排列。PEP羧化酶在叶肉细胞固定CO₂→生成C4酸→转运到维管束鞘细胞释放CO₂→被维管束鞘细胞中的RuBisCO用于Calvin循环。C4植物在高温干旱条件下光呼吸极低，光合效率更高。", "pitfall": "C4植物的RuBisCO不在叶肉细胞，而在维管束鞘细胞——这是Kranz结构的关键特征。PEP羧化酶在叶肉细胞中「初固定」CO₂以浓缩。"}, {"type": "tf", "points": 2, "question": "光合作用释放的O₂来自CO₂的光解。", "answer": 1, "explanation": "错误。光合作用释放的O₂来自H₂O的光解（水的氧化），不是CO₂。这一结论由¹⁸O同位素标记实验证明——用H₂¹⁸O培养植物时释放的是¹⁸O₂，用C¹⁸O₂时释放的是普通O₂。", "pitfall": "总反应式中O₂看起来 // ─── Answer normalization (robust to how the JSON was authored) ──────
// tf / choice answers may arrive as int index, boolean, letter ("A"),
// or label string ("正确"/"错误"/"对"/"错"). All are coerced to an
// option index so grading never silently fails on a type mismatch.

function tfAnswerIndex(ans) {
  // option 0 = true_label (正确), option 1 = false_label (错误)
  if (typeof ans === 'boolean') return ans ? 0 : 1;
  if (typeof ans === 'number') return ans === 0 ? 0 : 1;
  var s = ('' + ans).trim().toLowerCase();
  var truthy = ['0', 't', 'true', '正确', '对', '是', 'yes', 'y', '√', '✓'];
  var falsy  = ['1', 'f', 'false', '错误', '错', '否', 'no', 'n', '×', 'x'];
  if (truthy.indexOf(s) !== -1) return 0;
  if (falsy.indexOf(s) !== -1) return 1;
  return ans ? 0 : 1;
}

function choiceAnswerIndex(ans, options) {
  if (typeof ans === 'number') return ans;
  var s = ('' + ans).trim();
  if (/^[A-Za-z]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (options) {
    for (var i = 0; i < options.length; i++) {
      if (('' + options[i]).trim() === s) return i;
    }
  }
  return parseInt(s, 10);
}

function multiAnswerSet(ans, options) {
  var arr = Array.isArray(ans) ? ans : [ans];
  var set = {};
  for (var i = 0; i < arr.length; i++) {
    set[choiceAnswerIndex(arr[i], options)] = true;
  }
  return set;
}

// Normalize free text for fill-in-the-blank comparison: trim, lowercase,
// drop surrounding whitespace and common punctuation, unify full/half width.
function normText(s) {
  s = ('' + s).trim().toLowerCase();
  s = s.replace(/[\s　]+/g, '');
  s = s.replace(/[.,;:!?。，、；：！？“”"'（）()【】\[\]<>《》]/g, '');
  // full-width ASCII -> half-width
  s = s.replace(/[！-～]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
  });
  return s;
}

// How many blanks does a fill question have? Count underscore / ＿ runs.
function fillBlankCount(question) {
  var m = ('' + question).match(/(_{2,}|＿+)/g);
  return m ? m.length : 0;
}

// Coerce a fill `answer` into an array (one entry per blank) of accepted
// answer lists. Handles: string, [synonyms], [[blank1 syns],[blank2 syns]].
function fillBlankAnswers(ans, nBlanks) {
  if (nBlanks < 1) nBlanks = 1;
  if (!Array.isArray(ans)) return padBlanks([[ans]], nBlanks);
  if (ans.length && Array.isArray(ans[0])) return padBlanks(ans, nBlanks);
  // flat array of strings
  if (nBlanks === 1) return [ans];                 // synonyms for one blank
  if (ans.length === nBlanks) {                    // one answer per blank
    return ans.map(function (a) { return [a]; });
  }
  return padBlanks([ans], nBlanks);                // ambiguous -> all on blank 1
}

function padBlanks(arr, n) {
  var out = arr.slice(0, n);
  while (out.length < n) out.push(['']);
  return out;
}

function build() {
  var container = document.getElementById('questions-container');
  if (!container) { console.error('ExamPass: questions-container not found'); return; }

  // Stable-sort questions by section order so headings group correctly
  // regardless of input order.
  var order = LABELS.section_order || [];
  Q.forEach(function (q, i) { q._i = i; });
  Q.sort(function (a, b) {
    var oa = order.indexOf(a.type); if (oa === -1) oa = 99;
    var ob = order.indexOf(b.type); if (ob === -1) ob = 99;
    return oa - ob || a._i - b._i;
  });

  var h = '';
  var sec = '';
  var titles = LABELS.section;

  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    if (q.type !== sec) {
      sec = q.type;
      if (titles[q.type]) h += '<h3>' + titles[q.type] + '</h3>';
    }

    var qid = 'q' + i;
    h += '<div class="q-card" id="card-' + qid + '">';
    h += '<div class="q-num">' + (i + 1) + '. (' + q.points + ' ' + LABELS.points_suffix + ')</div>';

    if (q.type === 'fill') {
      h += '<div class="q-text">' + renderFill(q, qid) + '</div>';
    } else {
      h += '<div class="q-text">' + q.question + '</div>';
    }

    if (q.type === 'choice') {
      var opts = q.options || [];
      for (var j = 0; j < opts.length; j++) {
        h += '<label class="option" id="opt-' + qid + '-' + j + '" onclick="sel(\'' + qid + '\',' + j + ')">';
        h += '<input type="radio" name="' + qid + '" value="' + j + '">' + String.fromCharCode(65 + j) + '. ' + opts[j] + '</label>';
      }
    } else if (q.type === 'multi') {
      var mopts = q.options || [];
      for (var k = 0; k < mopts.length; k++) {
        h += '<label class="option" id="opt-' + qid + '-' + k + '" onclick="toggle(\'' + qid + '\',' + k + ')">';
        h += '<input type="checkbox" name="' + qid + '" value="' + k + '">' + String.fromCharCode(65 + k) + '. ' + mopts[k] + '</label>';
      }
    } else if (q.type === 'tf') {
      h += '<label class="option" id="opt-' + qid + '-0" onclick="sel(\'' + qid + '\',0)">';
      h += '<input type="radio" name="' + qid + '" value="0">' + LABELS.true_label + '</label>';
      h += '<label class="option" id="opt-' + qid + '-1" onclick="sel(\'' + qid + '\',1)">';
      h += '<input type="radio" name="' + qid + '" value="1">' + LABELS.false_label + '</label>';
    } else if (q.type === 'fill') {
      // inputs already rendered inline inside q-text
    } else if (q.type === 'code') {
      h += '<textarea class="q-textarea q-code" id="text-' + qid + '" placeholder="' + (LABELS.code_placeholder || LABELS.placeholder) + '" rows="8" spellcheck="false"></textarea>';
    } else {
      h += '<textarea class="q-textarea" id="text-' + qid + '" placeholder="' + LABELS.placeholder + '" rows="3"></textarea>';
    }

    h += '<div class="result" id="result-' + qid + '">';
    h += '<span class="badge" id="badge-' + qid + '"></span><span id="correct-' + qid + '"></span>';
    h += '<div class="explanation">' + (q.explanation || '') + '</div>';
    if (q.pitfall) {
      h += '<div class="pitfall">' + LABELS.pitfall_prefix + q.pitfall + '</div>';
    }
    h += '</div></div>';
  }

  container.innerHTML = h;

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([container]).catch(function (err) {
      console.error('MathJax typeset error:', err);
    });
  }
}

// Render fill question text with inline <input> boxes replacing blanks.
function renderFill(q, qid) {
  var nBlanks = fillBlankCount(q.question);
  var k = 0;
  var html = ('' + q.question).replace(/(_{2,}|＿+)/g, function () {
    var inp = '<input type="text" class="fill-input" id="fill-' + qid + '-' + k + '" autocomplete="off" spellcheck="false">';
    k++;
    return inp;
  });
  if (k === 0) {
    // No markers in text -> append boxes based on answer shape
    var n = fillBlankAnswers(q.answer, 1).length;
    var ans = q.answer;
    if (Array.isArray(ans)) n = Array.isArray(ans[0]) ? ans.length : (ans.length || 1);
    if (n < 1) n = 1;
    html += '<div class="fill-row">';
    for (var b = 0; b < n; b++) {
      if (n > 1) html += '<span class="fill-tag">' + (b + 1) + '.</span>';
      html += '<input type="text" class="fill-input" id="fill-' + qid + '-' + b + '" autocomplete="off" spellcheck="false">';
    }
    html += '</div>';
  }
  return html;
}

document.addEventListener('DOMContentLoaded', build);
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  build();
}

// ─── Selection handlers ──────────────────────────────────────────────

function sel(qid, idx) {
  var prefix = 'opt-' + qid + '-';
  var all = document.querySelectorAll('[id^="' + prefix + '"]');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
  var target = document.getElementById('opt-' + qid + '-' + idx);
  if (target) target.classList.add('selected');
  var radio = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  if (radio) radio.checked = true;
}

function toggle(qid, idx) {
  var box = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  var label = document.getElementById('opt-' + qid + '-' + idx);
  if (!box) return;
  box.checked = !box.checked;
  if (label) label.classList.toggle('selected', box.checked);
}

// ─── Grading ─────────────────────────────────────────────────────────

function gradeAll() {
  var score = 0;
  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    var qid = 'q' + i;
    var card = document.getElementById('card-' + qid);
    var result = document.getElementById('result-' + qid);
    var badge = document.getElementById('badge-' + qid);
    var correctEl = document.getElementById('correct-' + qid);
    if (!card || !result) continue;

    result.style.display = 'block';

    if (q.type === 'choice' || q.type === 'tf') {
      score += gradeSingle(q, qid, card, badge, correctEl);
    } else if (q.type === 'multi') {
      score += gradeMulti(q, qid, card, badge, correctEl);
    } else if (q.type === 'fill') {
      score += gradeFill(q, qid, card, badge, correctEl);
    } else {
      card.classList.add('correct');
      badge.className = 'badge badge-ref';
      badge.textContent = LABELS.reference_label;
    }
  }

  var sb = document.getElementById('score-box');
  if (sb) {
    sb.style.display = 'block';
    document.getElementById('score-num').textContent = roundScore(score);
    sb.scrollIntoView({ behavior: 'smooth' });
  }

  var opts = document.querySelectorAll('.option');
  for (var a = 0; a < opts.length; a++) opts[a].style.pointerEvents = 'none';
  var tas = document.querySelectorAll('.q-textarea');
  for (var b = 0; b < tas.length; b++) tas[b].disabled = true;
  var fis = document.querySelectorAll('.fill-input');
  for (var c = 0; c < fis.length; c++) fis[c].disabled = true;

  var btn = document.getElementById('grade-btn');
  if (btn) { btn.disabled = true; btn.textContent = LABELS.graded_label; }

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(function (err) {
      console.error('MathJax typeset error:', err);
    });
  }
}

function roundScore(s) {
  return Math.round(s * 10) / 10;
}

function gradeSingle(q, qid, card, badge, correctEl) {
  var ansIdx = q.type === 'tf' ? tfAnswerIndex(q.answer) : choiceAnswerIndex(q.answer, q.options);
  var radio = document.querySelector('input[name="' + qid + '"]:checked');
  if (radio && parseInt(radio.value, 10) === ansIdx) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
    var ok = document.getElementById('opt-' + qid + '-' + ansIdx);
    if (ok) ok.classList.add('correct-answer');
    return q.points;
  }
  card.classList.add('wrong');
  badge.className = 'badge badge-no';
  badge.textContent = LABELS.wrong_label;
  var ansText = q.type === 'choice'
    ? String.fromCharCode(65 + ansIdx) + '. ' + (q.options ? q.options[ansIdx] : '')
    : (ansIdx === 0 ? LABELS.true_label : LABELS.false_label);
  correctEl.innerHTML = LABELS.answer_prefix + ansText;
  if (radio) {
    var wrongOpt = document.getElementById('opt-' + qid + '-' + radio.value);
    if (wrongOpt) wrongOpt.classList.add('wrong-answer');
  }
  var corr = document.getElementById('opt-' + qid + '-' + ansIdx);
  if (corr) corr.classList.add('correct-answer');
  return 0;
}

function gradeMulti(q, qid, card, badge, correctEl) {
  var want = multiAnswerSet(q.answer, q.options);
  var wantKeys = Object.keys(want).map(Number);
  var checked = document.querySelectorAll('input[name="' + qid + '"]:checked');
  var picked = [];
  for (var i = 0; i < checked.length; i++) picked.push(parseInt(checked[i].value, 10));

  var anyWrong = false, hitCorrect = 0;
  for (var p = 0; p < picked.length; p++) {
    if (want[picked[p]]) hitCorrect++;
    else anyWrong = true;
  }

  // reveal correct / wrong option markers
  var mopts = q.options || [];
  for (var j = 0; j < mopts.length; j++) {
    var el = document.getElementById('opt-' + qid + '-' + j);
    if (!el) continue;
    if (want[j]) el.classList.add('correct-answer');
    else if (picked.indexOf(j) !== -1) el.classList.add('wrong-answer');
  }

  var earned;
  if (!anyWrong && hitCorrect === wantKeys.length && picked.length === wantKeys.length) {
    earned = q.points;
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
  } else if (!anyWrong && hitCorrect > 0) {
    // 少选不错选 -> partial credit
    earned = roundScore(q.points * hitCorrect / wantKeys.length);
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  } else {
    earned = 0;
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  }
  return earned;
}

function multiAnswerText(keys, options) {
  return keys.sort(function (a, b) { return a - b; }).map(function (k) {
    return String.fromCharCode(65 + k) + '. ' + (options ? options[k] : '');
  }).join('  ');
}

function gradeFill(q, qid, card, badge, correctEl) {
  var nBlanks = fillBlankCount(q.question);
  var blanks = fillBlankAnswers(q.answer, nBlanks);
  var n = blanks.length;
  var hit = 0;
  var displays = [];

  for (var b = 0; b < n; b++) {
    var inp = document.getElementById('fill-' + qid + '-' + b);
    var accepted = blanks[b] || [''];
    var user = inp ? normText(inp.value) : '';
    var ok = false;
    for (var a = 0; a < accepted.length; a++) {
      if (accepted[a] !== '' && normText(accepted[a]) === user && user !== '') { ok = true; break; }
    }
    if (inp) inp.classList.add(ok ? 'fill-ok' : 'fill-no');
    if (ok) hit++;
    displays.push((n > 1 ? (b + 1) + '. ' : '') + accepted.filter(function (x) { return x !== ''; }).join(' / '));
  }

  var earned = roundScore(q.points * hit / n);
  correctEl.innerHTML = LABELS.answer_prefix + displays.join('   ');

  if (hit === n) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
  } else if (hit > 0) {
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
  } else {
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
  }
  return earned;
}
