/* === ExamPass Shared Styles === */

  h1, h2, h3 { page-break-after: avoid; }
}

#exampass-header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0; margin-bottom: 0;
}
.header-brand { font-size: 1.2em; font-weight: 700; color: #1a1a2e; letter-spacing: 0.3px; }
.header-url  { font-size: 0.78em; color: #999; }

pre { background: #f0ede0; padding: 10px; border-radius: var(--radius); overflow-x: auto; }

/* ── Textareas (compact) ── */

}

/* ── Partial-credit badge ── */
.badge-partial { background: #fef3c7; color: #92400e; }
.q-card.partial { border-color: #f59e0b; }

/* ── Result after grading ── */
.result {
  display: none; margin-top: 8px; padding: 8px 12px;
  background: #fefcf5; border: 1px solid var(--card-border);
  border-radius: 4px; font-size: 0.9em; line-height: 1.6;
}
.result .badge {
  display: inline-block; padding: 1px 9px; border-radius: 3px;

}
.badge-ok  { background: var(--correct-bg); color: #166534; }
.badge-no  { background: var(--wrong-bg); color: #991b1b; }
.badge-ref { background: #dbeafe; color: #1e40af; }

.result .explanation { margin-top: 4px; color: var(--ink); }
.result .pitfall { color: #b45309; margin-top: 3px; font-size: 0.9em; }

/* ── Grading button ── */
.grading-bar { text-align: center; margin: 20px 0; }
.grading-bar button {
  font-size: 1em; padding: 8px 32px; background: var(--accent);
  color: #fff; border: none; border-radius: var(--radius);
  cursor: pointer; font-weight: 600; letter-spacing: 0.3px;
}
.grading-bar button:hover     { background: var(--accent-hover); }
.grading-bar button:disabled  { background: #bbb; cursor: not-allowed; }

<script>
var Q = [{"type": "single_choice", "points": 3, "question": "呼吸链中，NADH的电子进入电子传递链的入口是？", "options": ["A. 复合体I（NADH-Q还原酶）", "B. 复合体II（琥珀酸-Q还原酶）", "C. 复合体III（细胞色素c还原酶）", "D. 辅酶Q"], "answer": "A", "explanation": "NADH将两个电子传递给复合体I（NADH-Q还原酶/NADH脱氢酶），经由FMN和铁硫蛋白（Fe-S簇），最终传递给辅酶Q（CoQ/UQ→UQH₂）。复合体I同时向外泵出4个H⁺。注意：FADH₂的电子从复合体II（琥珀酸脱氢酶）进入——位于NADH之后，因此每分子FADH₂泵出的质子较少，ATP产率也较低。", "pitfall": "复合体I和II的电子供体不同：I→NADH，II→FADH₂（来自琥珀酸→延胡索酸）。复合体II直接向CoQ传递电子，但复合体II本身不跨膜→不泵出H⁺。这就是为什么FADH₂只产~1.5 ATP而NADH产~2.5 ATP。"}, {"type": "single_choice", "points": 3, "question": "辅酶Q（CoQ/泛醌）和细胞色素c（Cyt c）在电子传递链中扮演什么角色？", "options": ["A. 两者都是固定在复合体内的辅基，不可自由移动", "B. 两者都是流动的电子载体，在复合体间穿梭传递电子", "C. CoQ是流动载体，Cyt c是固定辅基", "D. Cyt c是流动载体，CoQ是固定辅基"], "answer": "B", "explanation": "辅酶Q（脂溶性）在复合体I/II与III之间的脂双层中自由扩散，将从复合体I或II接收的电子运送到复合体III。细胞色素c则是在线粒体内膜外侧（膜间隙侧）的水溶性外周膜蛋白，在复合体III和IV之间穿梭传递电子。两者都是流动的电子载体——这使得电子传递链的各复合体不需要直接物理接触也能高效传递电子。", "pitfall": "CoQ是脂溶性、Cyt c是水溶性（外周膜蛋白）——它们的理化性质决定了其在膜中/膜表面的不同分布和运动方式。Cyt c通过其血红素辅基中的铁离子在Fe²⁺/Fe³⁺之间可逆变价来传递单个电子。"}, {"type": "single_choice", "points": 3, "question": "鱼藤酮（rotenone）是经典的呼吸链抑制剂，其作用部位是？", "options": ["A. 复合体I（阻断NADH→CoQ的电子传递）", "B. 复合体II（阻断琥珀酸→CoQ的电子传递）", "C. 复合体III（阻断CoQ→Cyt c的电子传递）", "D. 复合体IV（阻断Cyt c→O₂的电子传递）"], "answer": "A", "explanation": "鱼藤酮与复合体I中的铁硫蛋白结合，阻断电子从Fe-S簇传递到辅酶Q。因此NADH的电子无法进入呼吸链（但FADH₂通过复合体II进入的电子不受影响）。类似抑制剂还有阿米妥（amytal，巴比妥类药物）。鱼藤酮是传统杀虫剂和鱼毒——抑制线粒体呼吸导致生物窒息死亡。", "pitfall": "四大经典抑制剂及位点必须精确记忆：鱼藤酮/阿米妥→复合体I；抗霉素A→复合体III(Cyt b→Cyt c₁)；CN⁻/CO/N₃⁻→复合体IV(Cyt a₃→O₂)；寡霉素→ATP合酶(F₀质子通道)。常以'加入抑制剂X后观察NADH/FADH₂耗氧变化'的实验题形式考查。"}, {"type": "single_choice", "points": 3, "question": "表述'2,4-二硝基苯酚（DNP）是一种解偶联剂'的含义是？", "options": ["A. DNP破坏线粒体内膜的完整性，使基质内容物泄漏", "B. DNP抑制呼吸链电子的传递，使耗氧停止", "C. DNP在线粒体内膜中携带H⁺穿梭，消除质子梯度但不影响电子传递", "D. DNP抑制ATP合酶的F₀质子通道，阻止ATP合成"], "answer": "C", "explanation": "DNP是一种弱酸性质子载体（protonophore/uncoupler）。它在内膜中可逆地结合和释放H⁺：在线粒体内膜外侧质子化→扩散穿过内膜→在内侧去质子化释放H⁺→回到外侧。这样DNP提供了一个绕过ATP合酶F₀的质子回漏通道，使呼吸链泵出的H⁺梯度被短路→化学势能不能用于ATP合成→能量以热能形式散失。电子传递和耗氧不受影响（甚至因质子梯度降低而加速——称为呼吸控制率的丧失）。", "pitfall": "关键区分：抑制剂（如CN⁻）阻断电子传递→耗氧停止；解偶联剂（如DNP）不阻断电子传递→耗氧继续甚至加速，但质子梯度被消散→ATP不合成。DNP曾被用于减肥药但因致死性高热而被禁用。"}, {"type": "single_choice", "points": 4, "question": "根据化学渗透假说，线粒体内膜上ATP合酶合成ATP的直接驱动力是？", "options": ["A. 呼吸链复合体释放的化学键能", "B. 跨线粒体内膜的质子电化学梯度（proton-motive force, PMF）", "C. 高能磷酸中间体的转移", "D. 底物水平磷酸化提供的能量"], "answer": "B", "explanation": "Mitchell（1961年）提出的化学渗透假说认为：呼吸链电子传递→复合体I、III、IV将H⁺从基质泵到膜间隙→建立跨内膜的质子电化学梯度（Δp，即proton-motive force，包括ΔpH化学势+Δψ膜电位两部分）→H⁺通过ATP合酶F₀通道回流→驱动F₁催化头合成ATP。Mitchell因其学说获得1978年诺贝尔化学奖。", "pitfall": "化学渗透假说的核心不是'化学中间体'（这是早期错误假说的思路），而是'渗透能'——通过膜区室化储存能量（类似于水库蓄水→放水发电）。Δp由ΔpH和Δψ共同贡献：Δp = Δψ − (2.303RT/F)ΔpH。对于线粒体，Δψ（~−180 mV）是PMF的主要成分。"}, {"type": "single_choice", "points": 4, "question": "关于ATP合酶（F型ATP酶）的结构，以下对应关系正确的是？", "options": ["A. F₁部分 = 质子通道，F₀部分 = 催化ATP合成的头部", "B. F₁部分 = 催化头部（α₃β₃γδε亚基），F₀部分 = 跨膜质子通道（a₁b₂c₁₀₋₁₄亚基）", "C. F₁和F₀均参与质子运输，γ亚基负责ATP释放", "D. β亚基组成质子通道，α亚基负责催化ATP合成"], "answer": "B", "explanation": "ATP合酶（Complex V）由F₁（催化头部，亲水）和F₀（质子通道，疏水跨膜）两部分组成。F₁的亚基组成：α₃β₃γδε——其中3个β亚基各有催化位点（采用结合变化机制/binding change mechanism），γ亚基作为旋转轴，ε亚基连接γ和c环。F₀：a亚基形成两个半通道，b₂连接F₁和F₀作为定子，c环（10-14个c亚基）旋转驱动γ亚基转动。", "pitfall": "α和β亚基不可颠倒——β是催化亚基（含有ATP合成活性位点），α是结构亚基。γ亚基是旋转轴（驱动三个β亚基发生构象变化→结合变化机制）。整个ATP合酶的工作原理类似于水力发电+旋转马达：质子流驱动c环旋转→γ轴旋转→β亚基构象循环变化→ATP合成。"}, {"type": "single_choice", "points": 4, "question": "线粒体呼吸链中，一分子NADH经完整呼吸链传递到O₂时，P/O比值（每消耗1原子氧产生的ATP分子数）约为？", "options": ["A. 1.0", "B. 1.5", "C. 2.5", "D. 3.0"], "answer": "C", "explanation": "现代测量值：NADH→O₂的P/O≈2.5，FADH₂→O₂的P/O≈1.5（因为FADH₂从复合体II进入，绕过复合体I→少泵出4H⁺→每分子FADH₂少合成约1分子ATP）。旧教科书常用NADH=3和FADH₂=2的整数比，这是基于早期估计（每个NADH泵10H⁺，每合成1ATP需要3H⁺，再加1H⁺用于Pi输入→10/4=2.5）。考试中以新值2.5/1.5为准，但需灵活。", "pitfall": "P/O比的'实际值vs理论值'区分：理论最大值NADH=2.5, FADH₂=1.5；但实际细胞中质子泄漏等因素使P/O略低。注意题目要求什么值——大多数考试采用2.5/1.5。旧书3.0/2.0的整数比已不准确。"}, {"type": "true_false", "points": 2, "question": "抗霉素A（antimycin A）通过与复合体III的细胞色素b结合，阻断电子从Cyt bₕ传递到CoQ。", "answer": "错误", "explanation": "抗霉素A确实抑制复合体III，但具体阻断位点是电子从Cyt bₕ→Cyt bₗ（或更准确地说，阻断Cyt bₕ到CoQ的电子传递——即Q循环中的Qᵢ位点，阻断CoQ的再还原）。纠正：它阻断电子从Cyt bₕ传递到CoQ（Qᵢ位点处），而非从Cyt bₕ到Cyt c₁。Q循环受阻→电子传递中断。", "pitfall": "抗霉素A抑制复合体III是正确的，但细节上的阻断位点容易描述不准。考试中'抗霉素A抑制复合体III→阻断Q循环'是常见正确表述。具体的Qᵢ/Qₒ位点区分可能会考。"}, {"type": "true_false", "points": 2, "question": "氰化物（CN⁻）和一氧化碳（CO）通过竞争性与复合体IV的血红素a₃结合，阻断电子传递到O₂而使细胞窒息死亡。", "answer": "正确", "explanation": "CN⁻和CO对复合体IV（细胞色素c氧化酶）的抑制机制相同：它们与Cyt a₃的Fe²⁺（还原态）高亲和力结合，阻止其向O₂传递电子。这是致命性的抑制——复合体IV是电子传递链的终端，被阻断后整个呼吸链停止→ATP无法合成→细胞快速死亡。临床上氰化物中毒的解毒剂之一是亚硝酸盐（将血红蛋白氧化为MetHb，MetHb的Fe³⁺竞争结合CN⁻）。", "pitfall": "CN⁻和CO都与Cyt a₃的还原态Fe²⁺结合而非氧化态Fe³⁺——这是特异性结合位点。CN⁻比CO毒性更强的部分原因是CN⁻的结合力更强且不易被O₂竞争掉。"}, {"type": "true_false", "points": 3, "question": "呼吸链中电子传递的顺序由各电子载体的氧化还原电位（标准还原电位E°'）决定——电子总是从低还原电位（更易给出电子）向高还原电位（更易接受电子）传递。", "answer": "正确", "explanation": "电子传递方向由热力学决定：电子自发地从低E°'（更强的还原剂，更易给出电子）向高E°'（更强的氧化剂，更易接受电子）流动。呼吸链中各电子载体的E°'逐步递增：NAD⁺/NADH (−0.32 V) → FMN/FMNH₂ (−0.30 V) → CoQ/CoQH₂ (+0.045 V) → Cyt b (Fe³⁺/Fe²⁺, +0.077 V) → Cyt c₁ (+0.22 V) → Cyt c (+0.254 V) → Cyt a (+0.29 V) → Cyt a₃ (+0.35 V) → O₂/H₂O (+0.816 V)。每步E°'的升高对应于一个热力学上有利的自由能释放（ΔG°'=−nFΔE°'）。", "pitfall": "理解E°'与ΔG的关系：ΔG°'=−nFΔE°'。E°'越负→越强的还原剂（如NADH，E°'=−0.32 V）；E°'越正→越强的氧化剂（如O₂，E°'=+0.816 V）。电子从最负流向最正——类似于水流从高势能流向低势能（以电子视角：从低E°'→高E°'是'下山'过程）。"}, {"type": "true_false", "points": 3, "question": "解偶联蛋白UCP1（thermogenin/产热蛋白）是褐色脂肪组织特有的内膜蛋白，它在线粒体内膜上形成天然的质子通道，使质子不经ATP合酶直接流回基质→能量以热的形式释放——这对新生哺乳动物和冬眠动物维持体温至关重要。", "answer": "正确", "explanation": "UCP1（Uncoupling Protein 1）是褐色脂肪组织线粒体内膜中的天然解偶联蛋白。它形成质子通道，绕过ATP合酶→氧化释放的能量不用于ATP合成→以热能散失（非颤抖性产热）。这对新生儿（体表面积大、散热快）和冬眠动物（快速复温）至关重要。其去甲肾上腺素→PKA→脂肪酶→释放脂肪酸→脂肪酸激活UCP1的激活通路亦是经典考点。", "pitfall": "UCP1是天然的解偶联机制——与DNP（化学解偶联剂）不同，UCP1受生理调控（如寒冷→交感神经→去甲肾上腺素→β₃受体→cAMP→PKA→激素敏感脂肪酶→释放游离脂肪酸→脂肪酸别构激活UCP1）。UCP2-5在不同组织广泛分布，但生理角色仍在研究中。"}, {"type": "fill_blank", "points": 3, "question": "线粒体呼吸链（电子传递链）由四种复合体组成：复合体Ⅰ为____，复合体Ⅱ为____，复合体Ⅲ为____，复合体Ⅳ为____。", "answer": ["NADH-Q还原酶(NADH脱氢酶)", "琥珀酸-Q还原酶(琥珀酸脱氢酶)", "细胞色素c还原酶", "细胞色素c氧化酶"], "explanation": "四种复合体：(Ⅰ)NADH-Q还原酶（NADH脱氢酶）——含FMN和Fe-S簇，氧化NADH、泵出4H⁺；(Ⅱ)琥珀酸-Q还原酶（即TCA循环中的琥珀酸脱氢酶）——含FAD和Fe-S簇，氧化琥珀酸，不直接泵H⁺；(Ⅲ)细胞色素c还原酶——通过Q循环氧化还原CoQ→传递电子给Cyt c，泵出4H⁺；(Ⅳ)细胞色素c氧化酶——氧化Cyt c→还原O₂→H₂O，泵出2H⁺。", "pitfall": "复合体Ⅱ与TCA循环的琥珀酸脱氢酶是同一个酶——这是呼吸链和TCA循环唯一的酶级联点。复合体Ⅱ不泵H⁺是FADH₂产ATP少于NADH的直接原因。另需注意：复合体V=ATP合酶，虽常与I-IV并提，但它不是电子传递链的一部分而是氧化磷酸化的终端酶。"}, {"type": "fill_blank", "points": 3, "question": "ATP合酶的催化机制是Boyer提出的____模型（binding change mechanism）：F₁的三个β亚基依次经历三种构象：____（与ADP和Pi结合）、____（催化ATP合成并紧密结合ATP）和____（释放ATP）。γ亚基的旋转驱动这三种构象的循环变化。", "answer": ["结合变化", "L构象(松弛/loose)", "T构象(紧密/tight)", "O构象(开放/open)"], "explanation": "Boyer（1997年诺贝尔化学奖）提出ATP合酶的结合变化机制：(1)O（Open/开放）构象——释放ATP、接受新的ADP+Pi；(2)L（Loose/松弛）构象——ADP和Pi结合但不合成；(3)T（Tight/紧密）构象——催化ADP+Pi→ATP的合成，产物ATP被紧密包裹在活性位点。γ亚基每旋转120°驱动β亚基在O→L→T→O之间循环一次——c环每旋转一圈（每个c亚基对应一个质子）合成约3个ATP（因为c环有~8-14个c亚基，三者之间对应质子数/ATP数的化学计量关系）。", "pitfall": "三个构象的英文缩写和中文含义：O=Open/开放（释放ATP）、L=Loose/松弛（底物结合但不催化）、T=Tight/紧密（催化合成）。不要记混顺序：O→L→T→O。注意：ATP的合成在T构象中完成（不是O构象）→合成后经构象变化到O→释放。"}, {"type": "fill_blank", "points": 4, "question": "按化学渗透假说，每分子NADH通过呼吸链完全氧化时，复合体Ⅰ泵出____个H⁺，复合体Ⅲ泵出____个H⁺，复合体Ⅳ泵出____个H⁺（写成数字）。合成1分子ATP约需____个H⁺回流（包括Pi转运消耗的1个H⁺）。", "answer": ["4", "4", "2", "4"], "explanation": "化学渗透假说的质子化学计量：NADH→复合体I(4H⁺)→CoQ→复合体III(4H⁺)→Cyt c→复合体IV(2H⁺)→O₂。每个NADH共泵出10H⁺。合成1ATP需要约4H⁺回流（3个用于ATP合成本身+F₀驱动亨利循环，1个用于Pi通过Pi载体输入基质）→P/O=10/4=2.5。对于FADH₂（从复合体II进入，绕过复合体I）：泵出6H⁺→P/O=6/4=1.5。", "pitfall": "质子计数的具体数字因物种和条件而异（细菌与线粒体不同），以上为线粒体通用数值。注意区分：P/O比不仅取决于质子泵出数，还取决于c环的亚基数（决定了每个H⁺周转合成的ATP比例）——但教材通常以固定化学计量比来简化。"}, {"type": "fill_blank", "points": 4, "question": "化学渗透假说（chemiosmotic hypothesis）由英国生物化学家____于1961年提出，他因此获得____年诺贝尔化学奖。该假说认为：呼吸链起到了____的作用，将线粒体基质的____泵到膜间隙，所形成的____梯度是氧化磷酸化的直接驱动力。", "answer": ["Mitchell(米切尔)", "1978", "质子泵", "H⁺(质子)", "质子电化学梯度(proton-motive force)"], "explanation": "化学渗透假说是20世纪生物化学最伟大的理论之一。Mitchell在1961年提出该假说时被广泛质疑——当时主流的'化学中间体假说'认为存在类似底物水平磷酸化的高能共价中间体。直到20世纪70年代，封闭膜囊泡（脂质体+细菌视紫红质+ATP合酶）重构实验证实了质子梯度足以驱动ATP合成，化学渗透假说才被广泛接受。Mitchell的杰出贡献在于把氧化磷酸化从化学问题转变为膜生物能学问题。", "pitfall": "1978年诺贝尔化学奖授予Peter Mitchell——单凭科学假说获奖在诺贝尔奖历史上极为罕见，足见该学说的伟大影响。'化学渗透'（chemiosmosis）中'渗透'一词可能引起误解（与水的渗透无关），其本意是指质子跨膜的渗透性流动——实际上是'化学+渗透'的结合。"}, {"type": "short_answer", "points": 5, "question": "线粒体呼吸链中有两种流动的电子载体（辅酶Q和细胞色素c），请说明它们各有什么结构特点使其适合在复合体之间穿梭传递电子。", "answer": "辅酶Q（CoQ/UQ）：带有长异戊二烯侧链的醌类化合物。其醌环可进行可逆的双电子/双质子氧化还原（Q→QH₂），异戊二烯侧链（~10个单位，Q₁₀）赋予其高度脂溶性，使其能在脂双层疏水核心中自由侧向扩散——从而在复合体I/II和复合体III之间传递电子。\n\n细胞色素c：是水溶性外周膜蛋白，位于线粒体内膜外侧（膜间隙面）。其血红素辅基中的Fe离子可在Fe²⁺/Fe³⁺之间可逆变价（单电子传递），且通过静电作用与复合体III和IV的亚基特异性识别、结合→传递单个电子。Cyt c从复合体III获得电子后解离→扩散到复合体IV→将电子转移给Cyt a。\n\n两种流动载体的共同优势：使各复合体不需要直接物理接触→电子传递链更灵活、更可靠。", "explanation": "两类流动载体的结构-功能适配：(1)CoQ脂溶性+长侧链→膜内自由扩散；(2)Cyt c水溶性+血红素+碱性表面→膜表面可逆结合/解离。两者分别传递氢原子（2e⁻+2H⁺）和电子（1e⁻）——这种分工使Q循环成为可能。", "pitfall": "CoQ传递的是'氢原子'（2e⁻+2H⁺），Cyt c传递的是'单个电子'（Fe³⁺+e⁻→Fe²⁺）。这是生物氧化中的一个经典区考点——CoQ位于电子分支点，可以介导从双电子供体（NADH/FADH₂）到单电子受体（Cyt b/Cyt c₁）的转换（Q循环）。"}, {"type": "short_answer", "points": 7, "question": "现有三个实验室各用不同的抑制剂处理线粒体：(A)加入鱼藤酮，(B)加入抗霉素A，(C)加入CN⁻。对于每种处理，请分别说明：(1)NADH能否被氧化？(2)FADH₂（来自琥珀酸）能否被氧化？(3)ATP能否合成？", "answer": "(A) 鱼藤酮（抑制复合体I）：(1)NADH不能被氧化——电子无法从NADH传递给CoQ；(2)FADH₂能被氧化——复合体II不受抑制，电子可从琥珀酸→复合体II→CoQ→复合体III→Cyt c→复合体IV→O₂→合成ATP；(3)加入FADH₂（琥珀酸）时ATP可以合成（通过复合体II→III→IV），但加入NADH时不能。\n\n(B) 抗霉素A（抑制复合体III）：(1)NADH不能被氧化——电子虽可到达CoQ，但CoQ→Cyt c被阻断；(2)FADH₂也不能被氧化——同理会卡在CoQ处；(3)ATP不能合成——两类电子供体均无法完成完整链传递。\n\n(C) CN⁻（抑制复合体IV）：(1)NADH不能被氧化——电子可传递到Cyt c，但Cyt c→O₂被阻断，整个链停滞；(2)FADH₂也不能被氧化——同理；(3)ATP不能合成——两类电子供体的电子传递均中断，无质子梯度形成。", "explanation": "这道题考察三个关键点：(1)抑制剂的作用位点和特异性；(2)复合体I和II的电子进入位点不同；(3)电子传递、质子泵出和ATP合成三者的因果链被阻断在何处。鱼藤酮只阻断NADH通路→FADH₂还能呼吸合成ATP，这是实验区分NADH和FADH₂通路的重要工具。抗霉素A和CN⁻阻断下游→两条通路都报废。", "pitfall": "注意题设：鱼藤酮处理下FADH₂（来自琥珀酸）仍可被氧化并合成ATP——因为它的电子从复合体II（位于鱼藤酮抑制位点下游）进入。这是最容易答错的地方。抑制剂在呼吸链研究中的方法论意义：阶梯式抑制→确定电子载体的排列顺序。"}, {"type": "short_answer", "points": 10, "question": "综合论述题：请从(1)结构基础、(2)电子传递、(3)质子泵出、(4)ATP合成机制、(5)调控逻辑这五个层面，完整阐述线粒体中NADH经氧化磷酸化生成ATP的全过程。", "answer": "(1) 结构基础：氧化磷酸化发生在真核细胞的线粒体内膜褶皱（嵴）上。参与过程的结构：(a)四种呼吸链复合体（I-IV）嵌入内膜；(b)两种流动电子载体——CoQ（脂溶性，膜内扩散）和Cyt c（水溶性，膜间隙面）；(c)ATP合酶（F₀F₁，约在嵴的弯曲膜区域富集）。\n\n(2) 电子传递：2e⁻从NADH→复合体I（FMN→Fe-S→CoQH₂）→复合体III（通过Q循环：CoQH₂→Cyt b→Cyt c₁，排出2Cyt c(Fe²⁺)）→4Cyt c→复合体IV（Cyt a→Cyt a₃→O₂→2H₂O）。全程电子沿标准还原电位递增方向流动（从E°'=−0.32 V到+0.816 V），ΔE°'=1.14 V→释放大量自由能。\n\n(3) 质子泵出：复合体I泵出4H⁺，复合体III通过Q循环泵出4H⁺，复合体IV泵出2H⁺（每分子NADH共计泵出10H⁺→建立跨内膜Δp≈−180 mV + ΔpH~0.5-1.0）。\n\n(4) ATP合成：质子沿电化学梯度经F₀的c环回流→驱动c环和γ亚基旋转→F₁头部α₃β₃中β亚基经历O→L→T构象循环（结合变化机制）→每3个β亚基循环3次合成3ATP→约消耗10-12H⁺（取决于c环亚基数）。NADH的P/O≈2.5。\n\n(5) 调控逻辑：氧化磷酸化受呼吸控制（respiratory control）——ADP浓度是关键调节因子。ADP高→H⁺经ATP合酶回流快→质子梯度降低→电子传递加速（呼吸加快）→ATP合成增加→ADP降低→反馈抑制。解偶联蛋白（如UCP1）提供独立于ATP需求的产热途径。\n\n总之，氧化磷酸化是膜结构、电子转移、质子泵出、ATP合成完美耦合的分子机器——化学能→渗透能→化学能的优雅转化。", "explanation": "这是综合性大题，考察对氧化磷酸化全局的理解。五个层面由下到上构成完整的逻辑链：(1)是物理平台→(2)是驱动的能量来源→(3)是能量转换中间体→(4)是能量输出终端→(5)是代谢调控反馈。答题时保持这个递进结构十分重要。", "pitfall": "最容易遗漏的两点：(1)Q循环的详细机制——CoQH₂在Qₒ位点释放2e⁻（一个给Fe-S→Cyt c₁→Cyt c，一个给Cyt bₗ→Cyt bₕ→CoQ在Qᵢ位点），每轮Q循环泵出4H⁺但从复合体III只传出一个电子给Cyt c——因此需要两轮Q循环才能还原两个Cyt c；(2)结合变化机制中ADP+Pi的进入和ATP的释放是在不同构象中进行的——切勿写成'ATP在O构象合成'。"}];

// ─── Answer normalization (robust to how the JSON was authored) ──────
// tf / choice answers may arrive as int index, boolean, letter ("A"),
// or label string ("正确"/"错误"/"对"/"错"). All are coerced to an
// option index so grading never silently fails on a type mismatch.

function tfAnswerIndex(ans) {
  // option 0 = true_label (正确), option 1 = false_label (错误)
  if (typeof ans === 'boolean') return ans ? 0 : 1;
  if (typeof ans === 'number') return ans === 0 ? 0 : 1;
  var s = ('' + ans).trim().toLowerCase();
  var truthy = ['0', 't', 'true', '正确', '对', '是', 'yes', 'y', '√', '✓'];
  var falsy  = ['1', 'f', 'false', '错误', '错', '否', 'no', 'n', '×', 'x'];
  if (truthy.indexOf(s) !== -1) return 0;
  if (falsy.indexOf(s) !== -1) return 1;
  return ans ? 0 : 1;
}

function choiceAnswerIndex(ans, options) {
  if (typeof ans === 'number') return ans;
  var s = ('' + ans).trim();
  if (/^[A-Za-z]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (options) {
    for (var i = 0; i < options.length; i++) {
      if (('' + options[i]).trim() === s) return i;
    }
  }
  return parseInt(s, 10);
}

function multiAnswerSet(ans, options) {
  var arr = Array.isArray(ans) ? ans : [ans];
  var set = {};
  for (var i = 0; i < arr.length; i++) {
    set[choiceAnswerIndex(arr[i], options)] = true;
  }
  return set;
}

function normText(s) {
  s = ('' + s).trim().toLowerCase();
  s = s.replace(/[\s　]+/g, '');
  s = s.replace(/[.,;:!?。，、；：！？“”"'（）()【】\[\]<>《》]/g, '');
  // full-width ASCII -> half-width
  s = s.replace(/[！-～]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
  });
  return s;
}

// How many blanks does a fill question have? Count underscore / ＿ runs.
function fillBlankCount(question) {
  var m = ('' + question).match(/(_{2,}|＿+)/g);
  return m ? m.length : 0;
}

// Coerce a fill `answer` into an array (one entry per blank) of accepted
// answer lists. Handles: string, [synonyms], [[blank1 syns],[blank2 syns]].
function fillBlankAnswers(ans, nBlanks) {
  if (nBlanks < 1) nBlanks = 1;
  if (!Array.isArray(ans)) return padBlanks([[ans]], nBlanks);
  if (ans.length && Array.isArray(ans[0])) return padBlanks(ans, nBlanks);
  // flat array of strings
  if (nBlanks === 1) return [ans];                 // synonyms for one blank
  if (ans.length === nBlanks) {                    // one answer per blank
    return ans.map(function (a) { return [a]; });
  }
  return padBlanks([ans], nBlanks);                // ambiguous -> all on blank 1
}

function padBlanks(arr, n) {
  var out = arr.slice(0, n);
  while (out.length < n) out.push(['']);
  return out;
}

// ─── Build ───────────────────────────────────────────────────────────

function build() {
  var container = document.getElementById('questions-container');
  if (!container) { console.error('ExamPass: questions-container not found'); return; }

  // Stable-sort questions by section order so headings group correctly
  // regardless of input order.
  var order = LABELS.section_order || [];
  Q.forEach(function (q, i) { q._i = i; });
  Q.sort(function (a, b) {
    var oa = order.indexOf(a.type); if (oa === -1) oa = 99;
    var ob = order.indexOf(b.type); if (ob === -1) ob = 99;
    return oa - ob || a._i - b._i;
  });

  var h = '';
  var sec = '';
  var titles = LABELS.section;

  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    if (q.type !== sec) {
      sec = q.type;
      if (titles[q.type]) h += '<h3>' + titles[q.type] + '</h3>';
    }

    var qid = 'q' + i;
    h += '<div class="q-card" id="card-' + qid + '">';
    h += '<div class="q-num">' + (i + 1) + '. (' + q.points + ' ' + LABELS.points_suffix + ')</div>';

    if (q.type === 'fill') {
      h += '<div class="q-text">' + renderFill(q, qid) + '</div>';
    } else {
      h += '<div class="q-text">' + q.question + '</div>';
    }

    if (q.type === 'choice') {
      var opts = q.options || [];
      for (var j = 0; j < opts.length; j++) {
        h += '<label class="option" id="opt-' + qid + '-' + j + '" onclick="sel(\'' + qid + '\',' + j + ')">';
        h += '<input type="radio" name="' + qid + '" value="' + j + '">' + String.fromCharCode(65 + j) + '. ' + opts[j] + '</label>';
      }
    } else if (q.type === 'multi') {
      var mopts = q.options || [];
      for (var k = 0; k < mopts.length; k++) {
        h += '<label class="option" id="opt-' + qid + '-' + k + '" onclick="toggle(\'' + qid + '\',' + k + ')">';
        h += '<input type="checkbox" name="' + qid + '" value="' + k + '">' + String.fromCharCode(65 + k) + '. ' + mopts[k] + '</label>';
      }
    } else if (q.type === 'tf') {
      h += '<label class="option" id="opt-' + qid + '-0" onclick="sel(\'' + qid + '\',0)">';
      h += '<input type="radio" name="' + qid + '" value="0">' + LABELS.true_label + '</label>';
      h += '<label class="option" id="opt-' + qid + '-1" onclick="sel(\'' + qid + '\',1)">';
      h += '<input type="radio" name="' + qid + '" value="1">' + LABELS.false_label + '</label>';
    } else if (q.type === 'fill') {
      // inputs already rendered inline inside q-text
    } else if (q.type === 'code') {
      h += '<textarea class="q-textarea q-code" id="text-' + qid + '" placeholder="' + (LABELS.code_placeholder || LABELS.placeholder) + '" rows="8" spellcheck="false"></textarea>';
    } else {
      h += '<textarea class="q-textarea" id="text-' + qid + '" placeholder="' + LABELS.placeholder + '" rows="3"></textarea>';
    }

    h += '<div class="result" id="result-' + qid + '">';
    h += '<span class="badge" id="badge-' + qid + '"></span><span id="correct-' + qid + '"></span>';
    h += '<div class="explanation">' + (q.explanation || '') + '</div>';
    if (q.pitfall) {
      h += '<div class="pitfall">' + LABELS.pitfall_prefix + q.pitfall + '</div>';
    }
    h += '</div></div>';
  }

  container.innerHTML = h;

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([container]).catch(function (err) {
      console.error('MathJax typeset error:', err);
    });
  }
}

// Render fill question text with inline <input> boxes replacing blanks.
function renderFill(q, qid) {
  var nBlanks = fillBlankCount(q.question);
  var k = 0;
  var html = ('' + q.question).replace(/(_{2,}|＿+)/g, function () {
    var inp = '<input type="text" class="fill-input" id="fill-' + qid + '-' + k + '" autocomplete="off" spellcheck="false">';
    k++;
    return inp;
  });
  if (k === 0) {
    // No markers in text -> append boxes based on answer shape
    var n = fillBlankAnswers(q.answer, 1).length;
    var ans = q.answer;
    if (Array.isArray(ans)) n = Array.isArray(ans[0]) ? ans.length : (ans.length || 1);
    if (n < 1) n = 1;
    html += '<div class="fill-row">';
    for (var b = 0; b < n; b++) {
      if (n > 1) html += '<span class="fill-tag">' + (b + 1) + '.</span>';
      html += '<input type="text" class="fill-input" id="fill-' + qid + '-' + b + '" autocomplete="off" spellcheck="false">';
    }
    html += '</div>';
  }
  return html;
}

document.addEventListener('DOMContentLoaded', build);
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  build();
}

// ─── Selection handlers ──────────────────────────────────────────────

function sel(qid, idx) {
  var prefix = 'opt-' + qid + '-';
  var all = document.querySelectorAll('[id^="' + prefix + '"]');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
  var target = document.getElementById('opt-' + qid + '-' + idx);
  if (target) target.classList.add('selected');
  var radio = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  if (radio) radio.checked = true;
}

function toggle(qid, idx) {
  var box = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  var label = document.getElementById('opt-' + qid + '-' + idx);
  if (!box) return;
  box.checked = !box.checked;
  if (label) label.classList.toggle('selected', box.checked);
}

// ─── Grading ─────────────────────────────────────────────────────────

function gradeAll() {
  var score = 0;
  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    var qid = 'q' + i;
    var card = document.getElementById('card-' + qid);
    var result = document.getElementById('result-' + qid);
    var badge = document.getElementById('badge-' + qid);
    var correctEl = document.getElementById('correct-' + qid);
    if (!card || !result) continue;

    result.style.display = 'block';

    if (q.type === 'choice' || q.type === 'tf') {
      score += gradeSingle(q, qid, card, badge, correctEl);
    } else if (q.type === 'multi') {
      score += gradeMulti(q, qid, card, badge, correctEl);
    } else if (q.type === 'fill') {
      score += gradeFill(q, qid, card, badge, correctEl);
    } else {
      card.classList.add('correct');
      badge.className = 'badge badge-ref';
      badge.textContent = LABELS.reference_label;
    }
  }

  var sb = document.getElementById('score-box');
  if (sb) {
    sb.style.display = 'block';
    document.getElementById('score-num').textContent = roundScore(score);
    sb.scrollIntoView({ behavior: 'smooth' });
  }

  var opts = document.querySelectorAll('.option');
  for (var a = 0; a < opts.length; a++) opts[a].style.pointerEvents = 'none';
  var tas = document.querySelectorAll('.q-textarea');
  for (var b = 0; b < tas.length; b++) tas[b].disabled = true;
  var fis = document.querySelectorAll('.fill-input');
  for (var c = 0; c < fis.length; c++) fis[c].disabled = true;

  var btn = document.getElementById('grade-btn');
  if (btn) { btn.disabled = true; btn.textContent = LABELS.graded_label; }

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(function (err) {
      console.error('MathJax typeset error:', err);
    });
  }
}

function roundScore(s) {
  return Math.round(s * 10) / 10;
}

function gradeSingle(q, qid, card, badge, correctEl) {
  var ansIdx = q.type === 'tf' ? tfAnswerIndex(q.answer) : choiceAnswerIndex(q.answer, q.options);
  var radio = document.querySelector('input[name="' + qid + '"]:checked');
  if (radio && parseInt(radio.value, 10) === ansIdx) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
    var ok = document.getElementById('opt-' + qid + '-' + ansIdx);
    if (ok) ok.classList.add('correct-answer');
    return q.points;
  }
  card.classList.add('wrong');
  badge.className = 'badge badge-no';
  badge.textContent = LABELS.wrong_label;
  var ansText = q.type === 'choice'
    ? String.fromCharCode(65 + ansIdx) + '. ' + (q.options ? q.options[ansIdx] : '')
    : (ansIdx === 0 ? LABELS.true_label : LABELS.false_label);
  correctEl.innerHTML = LABELS.answer_prefix + ansText;
  if (radio) {
    var wrongOpt = document.getElementById('opt-' + qid + '-' + radio.value);
    if (wrongOpt) wrongOpt.classList.add('wrong-answer');
  }
  var corr = document.getElementById('opt-' + qid + '-' + ansIdx);
  if (corr) corr.classList.add('correct-answer');
  return 0;
}

function gradeMulti(q, qid, card, badge, correctEl) {
  var want = multiAnswerSet(q.answer, q.options);
  var wantKeys = Object.keys(want).map(Number);
  var checked = document.querySelectorAll('input[name="' + qid + '"]:checked');
  var picked = [];
  for (var i = 0; i < checked.length; i++) picked.push(parseInt(checked[i].value, 10));

  var anyWrong = false, hitCorrect = 0;
  for (var p = 0; p < picked.length; p++) {
    if (want[picked[p]]) hitCorrect++;
    else anyWrong = true;
  }

  // reveal correct / wrong option markers
  var mopts = q.options || [];
  for (var j = 0; j < mopts.length; j++) {
    var el = document.getElementById('opt-' + qid + '-' + j);
    if (!el) continue;
    if (want[j]) el.classList.add('correct-answer');
    else if (picked.indexOf(j) !== -1) el.classList.add('wrong-answer');
  }

  var earned;
  if (!anyWrong && hitCorrect === wantKeys.length && picked.length === wantKeys.length) {
    earned = q.points;
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
  } else if (!anyWrong && hitCorrect > 0) {
    // 少选不错选 -> partial credit
    earned = roundScore(q.points * hitCorrect / wantKeys.length);
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  } else {
    earned = 0;
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  }
  return earned;
}

function multiAnswerText(keys, options) {
  return keys.sort(function (a, b) { return a - b; }).map(function (k) {
    return String.fromCharCode(65 + k) + '. ' + (options ? options[k] : '');
  }).join('  ');
}

function gradeFill(q, qid, card, badge, correctEl) {
  var nBlanks = fillBlankCount(q.question);
  var blanks = fillBlankAnswers(q.answer, nBlanks);
  var n = blanks.length;
  var hit = 0;
  var displays = [];

  for (var b = 0; b < n; b++) {
    var inp = document.getElementById('fill-' + qid + '-' + b);
    var accepted = blanks[b] || [''];
    var user = inp ? normText(inp.value) : '';
    var ok = false;
    for (var a = 0; a < accepted.length; a++) {
      if (accepted[a] !== '' && normText(accepted[a]) === user && user !== '') { ok = true; break; }
    }
    if (inp) inp.classList.add(ok ? 'fill-ok' : 'fill-no');
    if (ok) hit++;
    displays.push((n > 1 ? (b + 1) + '. ' : '') + accepted.filter(function (x) { return x !== ''; }).join(' / '));
  }

  var earned = roundScore(q.points * hit / n);
  correctEl.innerHTML = LABELS.answer_prefix + displays.join('   ');

  if (hit === n) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
  } else if (hit > 0) {
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
  } else {
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
  }
  return earned;
}
